; Главный процесс контейнера. Сервисы робота — файлы ~/services/*.conf, они поднимаются при каждом старте.
[supervisord]
nodaemon=true
logfile=/home/robot/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/home/robot/.supervisor/supervisord.pid
childlogdir=/home/robot/logs

[unix_http_server]
file=/home/robot/.supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/robot/.supervisor/supervisor.sock

[include]
files = /home/robot/services/*.conf
