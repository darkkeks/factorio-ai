<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Карта Factorio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font: 14px/1.35 system-ui, sans-serif; color: #e8e6e1; background: #111; overflow: hidden; }
  #map { background: #000; }
  .leaflet-container { font: inherit; }

  .actor { transition: transform 1s linear; white-space: nowrap; pointer-events: auto; }
  .zooming .actor { transition: none; }
  .actor i { position: absolute; left: -7px; top: -7px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #111; background: #ffcc33; }
  .actor.player i { background: #6fd3ff; }
  .actor span { position: absolute; left: 0; top: -30px; transform: translateX(-50%); padding: 1px 6px; border-radius: 3px;
    background: rgba(17, 17, 17, .8); color: #ffcc33; font-weight: 600; font-size: 12px; }
  .actor.player span { color: #6fd3ff; }
  .actor.bot { cursor: pointer; }
  .actor.sel i { outline: 2px solid #fff; }

  .box { background: rgba(24, 24, 24, .92); border: 1px solid #3a3a3a; border-radius: 6px; }
  #status { position: absolute; z-index: 1000; left: 50px; top: 10px; right: 54px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
  #status span { padding: 4px 9px; border-radius: 4px; background: rgba(24, 24, 24, .92); border: 1px solid #3a3a3a; }
  #status .warn { background: #6b4a00; border-color: #a87400; color: #fff; }
  #status .bad { background: #6d1f1f; border-color: #a33; color: #fff; }
  #status span:empty { display: none; }

  #toggle { position: absolute; z-index: 1001; right: 10px; top: 10px; width: 36px; height: 36px; font-size: 18px; color: inherit; cursor: pointer; }
  #side { position: absolute; z-index: 1000; right: 10px; top: 54px; bottom: 26px; width: 320px; max-width: calc(100vw - 20px); overflow-y: auto; padding: 10px 12px; box-sizing: border-box; }
  #side.hidden, #bot.hidden { display: none; }
  h3 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #9a968c; }
  h3:first-child { margin-top: 0; }
  .muted { color: #9a968c; }
  .bar { height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin: 4px 0; }
  .bar b { display: block; height: 100%; background: #5fae4e; }
  .alert { cursor: pointer; padding: 2px 0; }
  .alert:hover { color: #fff; }
  .alert b { color: #ff8a65; font-weight: 600; }
  .event { margin: 5px 0; overflow-wrap: anywhere; }
  .event b { color: #ffcc33; font-weight: 600; }

  #bot { position: absolute; z-index: 1000; left: 10px; bottom: 26px; width: 380px; max-width: calc(100vw - 20px); max-height: 55%; overflow-y: auto; padding: 10px 12px; box-sizing: border-box; }
  #live { position: absolute; z-index: 1000; left: 10px; top: 84px; width: 480px; max-width: calc(100vw - 20px); padding: 6px; box-sizing: border-box; }
  /* Во всё окно браузера: карта остаётся под видео, сводка и панель бота — поверх. */
  #live.big { inset: 0; width: auto; max-width: none; z-index: 1002; border-radius: 0; border: 0; padding: 0; background: #000; display: flex; flex-direction: column; }
  #live.big video { flex: 1; min-height: 0; width: 100%; aspect-ratio: auto; object-fit: contain; border-radius: 0; }
  #live.big header { padding: 6px 54px 6px 8px; background: rgba(24, 24, 24, .92); }
  body.livebig #side, body.livebig #bot, body.livebig #toggle { z-index: 1003; }
  /* Маленькое живое окно и панель бота стоят слева друг над другом — панель не должна на него наезжать. */
  body.liveopen:not(.livebig) #bot { max-height: max(180px, calc(100% - 130px - min(480px, 100vw - 20px) * 9 / 16 - 50px)); }
  #live select { background: #333; color: inherit; border: 1px solid #555; border-radius: 4px; padding: 4px 6px; font: inherit; max-width: 45%; }
  #live:fullscreen { inset: 0; width: auto; max-width: none; padding: 0; border: 0; background: #000; display: flex; flex-direction: column; }
  #live:fullscreen video { flex: 1; min-height: 0; aspect-ratio: auto; object-fit: contain; }
  #live.hidden { display: none; }
  #live video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 3px; }
  #live header { display: flex; align-items: center; gap: 8px; padding: 0 2px 5px; }
  #live header span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #live-btn { position: absolute; z-index: 1001; left: 10px; top: 84px; }
  /* Сессии Claude бота: слева дерево (сессия и её субагенты), справа лог выбранного узла. */
  #sess { position: absolute; z-index: 1100; inset: 10px; background: #181818; display: flex; flex-direction: column; overflow: hidden; }
  #sess.hidden { display: none; }
  #sess > header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #3a3a3a; }
  #sess > header b { color: #ffcc33; font-size: 16px; white-space: nowrap; }
  #sess > header select { flex: 1; min-width: 0; background: #333; color: inherit; border: 1px solid #555; border-radius: 4px; padding: 4px 6px; font: inherit; }
  #sess-main { flex: 1; min-height: 0; display: flex; }
  #sess-tree { width: 300px; flex: none; overflow-y: auto; border-right: 1px solid #3a3a3a; padding: 6px; box-sizing: border-box; }
  #sess-log { flex: 1; min-width: 0; overflow-y: auto; padding: 8px 14px; }
  .node { padding: 4px 6px; border-radius: 4px; cursor: pointer; overflow-wrap: anywhere; }
  .node:hover { background: #2c2c2c; }
  .node.sel { background: #3d3418; }
  .node small { display: block; color: #9a968c; }
  .node { position: relative; }
  .node.arch { opacity: .5; }
  .node .toarch { position: absolute; right: 4px; top: 4px; display: none; padding: 0 6px; font-size: 12px; }
  .node:hover .toarch { display: block; }
  #sess-show-l { white-space: nowrap; color: #9a968c; cursor: pointer; }
  @media (hover: none) { .node .toarch { display: block; } }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #666; margin-right: 6px; }
  .dot.run { background: #5fae4e; box-shadow: 0 0 5px #5fae4e; }
  .ev { margin: 6px 0; overflow-wrap: anywhere; }
  .ev time { color: #9a968c; font-size: 11px; margin-right: 6px; }
  .ev.text { white-space: pre-wrap; }
  .ev.note, .ev.task, .ev.human { color: #9a968c; white-space: pre-wrap; border-left: 2px solid #555; padding-left: 8px; }
  .ev.task { color: #c9c5b8; border-left-color: #c79400; }
  .ev.tool summary { cursor: pointer; font-family: ui-monospace, monospace; font-size: 12px; color: #b9c7d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.tool summary b { color: #e8e6e1; }
  .ev.tool.err summary b { color: #ff8a65; }
  .ev.tool.wait summary b { color: #5fae4e; }
  .ev.tool pre { margin: 4px 0 4px 14px; padding: 6px 8px; background: #111; border-radius: 4px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 400px; overflow-y: auto; }
  .ev.tool .sub { margin-left: 14px; }
  #sess-older { display: block; margin: 0 auto 8px; }
  @media (max-width: 700px) { #sess { inset: 0; } #sess-main { flex-direction: column; } #sess-tree { width: auto; max-height: 30%; border-right: 0; border-bottom: 1px solid #3a3a3a; } }
  #bot header { display: flex; align-items: center; gap: 8px; }
  #bot header b { flex: 1; color: #ffcc33; font-size: 16px; }
  button { background: #333; color: inherit; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button.on { background: #7a5c00; border-color: #c79400; }
  .items { display: flex; flex-wrap: wrap; gap: 4px; }
  .items .slot { position: relative; width: 40px; height: 40px; background: #2c2c2c; border: 1px solid #444; border-radius: 3px; overflow: hidden; }
  /* Файл иконки — 64×64 и следом уменьшенные копии; показываем только первую. */
  .items .slot img { position: absolute; left: 3px; top: 3px; width: 34px; height: 34px; object-fit: cover; object-position: left center; }
  .items .slot img + small { display: none; }
  .items .slot b { position: absolute; right: 2px; bottom: 0; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 1px 1px 1px #000; }
  .items .slot { cursor: pointer; }
  #tip { position: fixed; z-index: 2000; max-width: 260px; padding: 5px 9px; font-size: 13px; background: #101010; border: 1px solid #666; border-radius: 4px; box-shadow: 0 2px 8px #000; pointer-events: none; }
  #tip.pinned { pointer-events: auto; }
  #tip.hidden { display: none; }
  #tip a { display: block; margin-top: 4px; color: #6fd3ff; }
  .items .slot small { position: absolute; inset: 2px; font-size: 8px; line-height: 1.1; overflow: hidden; overflow-wrap: anywhere; color: #ccc; }
  .log div { margin: 4px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .log .tool { font-family: ui-monospace, monospace; font-size: 12px; color: #b9c7d6; }
  .log time { color: #9a968c; margin-right: 6px; }
  .leaflet-control-attribution { display: none; }
  @media (max-width: 700px) { #side { width: auto; left: 10px; } #bot { max-height: 45%; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="status"><span id="st-conn" class="bad">подключение…</span><span id="st-cam" class="warn"></span><span id="st-pause" class="warn"></span><span id="st-fresh"></span></div>
<button id="toggle" class="box" title="Сводка">☰</button>
<div id="side" class="box hidden">
  <h3>Исследование</h3><div id="research" class="muted">—</div>
  <h3>Электросеть</h3><div id="power" class="muted">—</div>
  <h3>Тревоги</h3><div id="alerts" class="muted">—</div>
  <h3>События</h3><div id="events" class="muted">—</div>
</div>
<button id="live-btn" class="box">▶ живое окно</button>
<div id="live" class="box hidden">
  <header><span id="live-cap" class="muted">подключение…</span><select id="live-target" title="За кем следит камера"></select><button id="live-size" title="Во всё окно">⤢</button><button id="live-full" title="На весь экран">⛶</button><button id="live-close">✕</button></header>
  <video id="live-video" muted autoplay playsinline></video>
</div>
<div id="sess" class="box hidden">
  <header><b id="sess-bot"></b><select id="sess-list" title="Сессия"></select><button id="sess-arch" title="Убрать эту сессию в архив (или вернуть)">в архив</button><label id="sess-show-l" title="Показывать убранное в архив"><input type="checkbox" id="sess-show"> архив <span id="sess-archn"></span></label><button id="sess-close">✕</button></header>
  <div id="sess-main"><div id="sess-tree"></div><div id="sess-log"></div></div>
</div>
<div id="tip" class="hidden"></div>
<div id="bot" class="box hidden">
  <header><b id="bot-name"></b><button id="bot-sess">сессии</button><button id="bot-follow">следить</button><button id="bot-close">✕</button></header>
  <div id="bot-body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let NAMES = {}, NAMES_EN = {};
fetch('names.json').then((r) => r.json()).then((n) => { NAMES = n.ru || {}; NAMES_EN = n.en || {}; renderSummary(); }).catch(() => {});
const nm = (k) => NAMES[k] || k;
const STATUS = { no_fuel: 'нет топлива', no_power: 'нет питания', low_power: 'мало питания', not_plugged_in_electric_network: 'не подключено к сети',
  no_minable_resources: 'руда кончилась', missing_science_packs: 'нет колб', no_ammo: 'нет патронов', no_input_fluid: 'нет жидкости', missing_required_fluid: 'нет жидкости' };

const ZMAX = 5, TILE = 512; // на уровне ZMAX — 32 пикселя на клетку, тайл 16×16 клеток
const CRS = L.extend({}, L.CRS.Simple, { transformation: new L.Transformation(32 / 2 ** ZMAX, 0, 32 / 2 ** ZMAX, 0) });
const ll = (x, y) => L.latLng(y, x);
const span = (z) => 16 * 2 ** (ZMAX - z);

// Адрес хранит позицию и масштаб: #x,y,z
const start = (location.hash.slice(1).split(',').map(Number));
const hasStart = start.length === 3 && start.every(Number.isFinite);
const map = L.map('map', { crs: CRS, minZoom: 0, maxZoom: ZMAX + 1, zoomSnap: 0.5, zoomControl: true, attributionControl: false, zoomAnimation: true })
  .setView(hasStart ? ll(start[0], start[1]) : ll(0, 0), hasStart ? start[2] : ZMAX - 2);

// ---------- тайлы с версиями ----------
const tiles = new Map(); // "z/x/y" -> когда снят по часам сервера (0 — ещё не снят)
const shown = new Map(); // "z/x/y" -> <img> на экране
const tileUrl = (k) => `tiles/${k}.jpg?v=${tiles.get(k)}`;
const EMPTY = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const Base = L.GridLayer.extend({
  createTile(c) {
    const img = document.createElement('img');
    const k = `${c.z}/${c.x}/${c.y}`;
    img.alt = '';
    img.src = tiles.get(k) ? tileUrl(k) : EMPTY;
    shown.set(k, img);
    return img;
  },
});
const grid = { tileSize: TILE, minNativeZoom: 0, maxNativeZoom: ZMAX, maxZoom: ZMAX + 1, updateWhenZooming: false, keepBuffer: 1 };
const base = new Base(grid).addTo(map);
base.on('tileunload', (e) => { const c = e.coords; const k = `${c.z}/${c.x}/${c.y}`; if (shown.get(k) === e.tile) shown.delete(k); });
// Новую версию сначала загружаем в память и только потом подменяем — без мерцания.
function refreshTile(k) {
  const img = shown.get(k);
  if (!img || !tiles.get(k)) return;
  const url = tileUrl(k), pre = new Image();
  pre.onload = () => { if (shown.get(k) === img && tileUrl(k) === url) img.src = url; };
  pre.src = url;
}

const fogTiles = new Set(); // тайлы целиком в тумане войны: они не устаревают, пока чанк снова не увидят
function setTile(z, x, y, ts, fog) { const k = `${z}/${x}/${y}`; tiles.set(k, ts); if (fog) fogTiles.add(k); else fogTiles.delete(k); return k; }

// ---------- свежесть ----------
let offset = 0, sweepMs = 600000, paused = false;
const now = () => Date.now() + offset;
const staleLayer = L.layerGroup().addTo(map);
function age(ms) { const s = Math.max(0, Math.round(ms / 1000)); return s < 90 ? `${s} с` : s < 5400 ? `${Math.round(s / 60)} мин` : `${Math.round(s / 3600)} ч`; }
const viewZ = () => Math.max(0, Math.min(ZMAX, Math.round(map.getZoom())));
function updateFresh() {
  const b = map.getBounds(), z = viewZ(), s = span(z);
  const x1 = Math.floor(Math.min(b.getWest(), b.getEast()) / s), x2 = Math.floor(Math.max(b.getWest(), b.getEast()) / s);
  const y1 = Math.floor(Math.min(b.getSouth(), b.getNorth()) / s), y2 = Math.floor(Math.max(b.getSouth(), b.getNorth()) / s);
  let oldest = 0, n = 0, missing = 0, foggy = 0;
  staleLayer.clearLayers();
  const limit = sweepMs * 1.5;
  for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) {
    const ts = tiles.get(`${z}/${x}/${y}`);
    if (ts === undefined) continue;
    n++;
    if (fogTiles.has(`${z}/${x}/${y}`)) { foggy++; continue; }
    if (!ts) { missing++; continue; }
    const a = now() - ts;
    if (a > oldest) oldest = a;
    // Устаревшие участки заметно помечены. На паузе картинка не меняется, устаревать нечему.
    if (a > limit && !paused) L.rectangle([ll(x * s, y * s), ll(x * s + s, y * s + s)], { stroke: false, fillColor: '#ff9800', fillOpacity: 0.3, interactive: false }).addTo(staleLayer);
  }
  const el = $('st-fresh');
  if (!n) { el.textContent = 'здесь не разведано'; el.className = ''; return; }
  if (foggy === n) { el.textContent = 'туман войны: этот участок сейчас никто не видит'; el.className = ''; return; }
  el.textContent = missing + foggy === n ? 'этот участок ещё не снят' : (missing ? 'часть вида ещё не снята; ' : '') + (paused ? 'картинка на момент паузы' : `картинка не старше ${age(oldest)}`);
  el.className = paused ? '' : oldest > limit ? 'bad' : oldest > 30000 || missing ? 'warn' : '';
}
setInterval(updateFresh, 1000);

// ---------- метки ботов и игроков ----------
const markers = new Map(); // "bot:имя" | "player:имя" -> L.Marker
let selected = null, following = false, actors = [];
function syncActors(kind, list) {
  const seen = new Set();
  for (const a of list) {
    const k = `${kind}:${a.name}`;
    seen.add(k);
    let m = markers.get(k);
    if (!m) {
      m = L.marker(ll(a.x, a.y), { icon: L.divIcon({ className: `actor ${kind}`, html: `<i></i><span>${esc(a.name)}</span>`, iconSize: [0, 0] }), keyboard: false, zIndexOffset: kind === 'bot' ? 100 : 0 }).addTo(map);
      if (kind === 'bot') m.on('click', () => openBot(a.name));
      markers.set(k, m);
    } else m.setLatLng(ll(a.x, a.y));
    m.getElement()?.classList.toggle('sel', kind === 'bot' && a.name === selected);
  }
  for (const [k, m] of markers) if (k.startsWith(kind + ':') && !seen.has(k)) { m.remove(); markers.delete(k); }
}
map.on('zoomstart', () => map.getContainer().classList.add('zooming'));
map.on('zoomend', () => requestAnimationFrame(() => requestAnimationFrame(() => map.getContainer().classList.remove('zooming'))));
map.on('dragstart', () => setFollow(false));

function onLive(m) {
  paused = m.ok && m.paused;
  $('st-pause').textContent = paused ? '⏸ игра на паузе' : '';
  $('st-cam').textContent = m.ok && !m.camera ? 'камера не в игре — картинка не обновляется' : '';
  $('st-conn').textContent = m.ok ? '' : 'сервер игры не отвечает';
  $('st-conn').className = m.ok ? '' : 'bad';
  actors = m.bots;
  showTarget(m);
  syncActors('bot', m.bots);
  syncActors('player', m.players);
  if (following && selected) {
    const b = m.bots.find((x) => x.name === selected);
    if (b) map.panTo(ll(b.x, b.y), { animate: true, duration: 1, easeLinearity: 1 });
  }
}

// ---------- живое окно ----------
// Видео из окна клиента-камеры: один вид на всех зрителей. Рамка на карте показывает, куда смотрит камера.
let camSize = { w: 53, h: 30 }, camFrame = null, liveWs = null, liveTimer = null, liveBroken = false;
function showTarget(m) {
  const t = m.target, a = t && (t.kind === 'bot' ? m.bots : m.players).find((x) => x.name === t.name);
  const open = !$('live').classList.contains('hidden');
  if (!a || !open) { if (camFrame) { camFrame.remove(); camFrame = null; } }
  else {
    const b = [ll(a.x - camSize.w / 2, a.y - camSize.h / 2), ll(a.x + camSize.w / 2, a.y + camSize.h / 2)];
    if (camFrame) camFrame.setBounds(b); else camFrame = L.rectangle(b, { color: '#ffcc33', weight: 1.5, fill: false, dashArray: '6 4', interactive: false }).addTo(map);
  }
  if (!liveBroken) $('live-cap').textContent = !m.ok ? 'сервер игры не отвечает' : !m.camera ? 'камера не в игре' : t ? `камера следит за: ${t.name}${t.manual ? '' : ' (сама выбрала)'}` : 'камере не за кем следить';
  syncTargets(m, t);
}
// Список «за кем следить» — чтобы выбирать, не закрывая видео во всё окно.
let targetsKey = '';
function syncTargets(m, t) {
  const sel = $('live-target');
  const opts = [['', 'авто'], ...m.bots.map((a) => [`bot:${a.name}`, a.name]), ...m.players.map((a) => [`player:${a.name}`, `${a.name} (игрок)`])];
  const k = opts.map((o) => o[0]).join('|');
  if (k !== targetsKey) { targetsKey = k; sel.innerHTML = opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join(''); }
  if (document.activeElement !== sel) sel.value = t && t.manual ? `${t.kind}:${t.name}` : '';
}
$('live-target').onchange = (e) => {
  const v = e.target.value, i = v.indexOf(':');
  wsSend(v ? { t: 'follow', kind: v.slice(0, i), name: v.slice(i + 1) } : { t: 'follow', name: null });
  e.target.blur();
};
function setBig(on) {
  $('live').classList.toggle('big', on);
  document.body.classList.toggle('livebig', on);
  if (on) $('side').classList.add('hidden'); // сводка закрыла бы треть кадра; вернуть — кнопкой ☰
}
function liveStart() {
  const video = $('live-video');
  const MS = window.ManagedMediaSource || window.MediaSource, mime = 'video/mp4; codecs="avc1.42E01F"';
  if (!MS || !MS.isTypeSupported(mime)) { liveBroken = true; $('live-cap').textContent = 'этот браузер не умеет показывать живое окно (нужен H.264)'; return; }
  const ms = new MS();
  let sb = null, queue = [];
  video.disableRemotePlayback = true;
  video.src = URL.createObjectURL(ms);
  const pump = () => {
    if (!sb || sb.updating || ms.readyState !== 'open') return;
    try {
      // Держим в буфере только последние секунды.
      if (video.buffered.length && video.buffered.start(0) < video.currentTime - 8) return sb.remove(0, video.currentTime - 4);
      if (queue.length) sb.appendBuffer(queue.shift());
    } catch { queue = []; }
  };
  ms.addEventListener('sourceopen', () => {
    sb = ms.addSourceBuffer(mime);
    sb.mode = 'sequence'; // фрагменты идут подряд, с какого бы места ни подключились
    sb.addEventListener('updateend', pump);
    pump();
  });
  const sock = liveWs = new WebSocket(new URL('video', location.href.split('#')[0]).href.replace(/^http/, 'ws'));
  sock.binaryType = 'arraybuffer';
  sock.onmessage = (e) => { if (queue.length > 30) queue = []; queue.push(e.data); pump(); };
  sock.onclose = () => { if (liveWs === sock) { liveStop(); liveTimer = setTimeout(() => { if (!$('live').classList.contains('hidden')) liveStart(); }, 2000); } };
  // Не отставать от эфира: накопилось больше полутора секунд — перепрыгиваем к свежему.
  liveTimer = setInterval(() => {
    const b = video.buffered;
    if (!b.length) return;
    const end = b.end(b.length - 1);
    if (end - video.currentTime > 1.5 || video.currentTime < b.start(b.length - 1)) video.currentTime = end - 0.3;
    if (video.paused) video.play().catch(() => {});
  }, 1000);
}
function liveStop() {
  clearInterval(liveTimer); clearTimeout(liveTimer);
  const s = liveWs; liveWs = null;
  if (s) s.close();
  const v = $('live-video');
  if (v.src) { URL.revokeObjectURL(v.src); v.removeAttribute('src'); v.load(); }
}
$('live-btn').onclick = () => { document.body.classList.add('liveopen'); $('live').classList.remove('hidden'); $('live-btn').style.display = 'none'; liveStart(); };
$('live-close').onclick = () => { document.body.classList.remove('liveopen'); setBig(false); $('live').classList.add('hidden'); $('live-btn').style.display = ''; liveStop(); if (camFrame) { camFrame.remove(); camFrame = null; } };
$('live-size').onclick = () => setBig(!$('live').classList.contains('big'));
$('live-full').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else if ($('live').requestFullscreen) $('live').requestFullscreen().catch(() => {}); else if ($('live-video').webkitEnterFullscreen) $('live-video').webkitEnterFullscreen(); };
if (new URLSearchParams(location.search).has('live')) $('live-btn').onclick(); // ссылка сразу с живым окном: ?live

// ---------- панель бота ----------
let botTimer = null;
function setFollow(on) {
  following = on && !!selected;
  $('bot-follow').classList.toggle('on', following);
  // Камера живого окна идёт за тем же ботом, пока его не отпустили кнопкой «авто».
  if (following) wsSend({ t: 'follow', kind: 'bot', name: selected });
}
function openBot(name) {
  selected = name;
  $('bot').classList.remove('hidden');
  $('bot-name').textContent = name;
  $('bot-body').innerHTML = '<div class="muted">загрузка…</div>';
  lastBotHtml = '';
  clearInterval(botTimer);
  loadBot();
  botTimer = setInterval(loadBot, 2000);
}
function closeBot() { selected = null; setFollow(false); clearInterval(botTimer); $('bot').classList.add('hidden'); }
$('bot-close').onclick = closeBot;
$('bot-follow').onclick = () => {
  setFollow(!following);
  const b = following && actors.find((x) => x.name === selected);
  if (b) map.panTo(ll(b.x, b.y));
};
const utcTime = (t) => { const d = new Date(); const [h, mi, s] = t.split(':').map(Number); d.setUTCHours(h, mi, s); return d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
// Ячейка как в игре: иконка и количество; название — во всплывающей подсказке. Нет иконки — показываем название.
const count = (v) => (v >= 10000 ? `${Math.round(v / 1000)}k` : v >= 1000 ? `${(v / 1000).toFixed(1)}k` : v);
const slot = (name, n) => `<div class="slot" data-item="${esc(name)}" data-n="${n}"><img src="icon/${encodeURIComponent(name)}.png" alt="" onerror="this.remove()"><small>${esc(nm(name))}</small><b>${count(n)}</b></div>`;
let lastBotHtml = '';
async function loadBot() {
  const name = selected;
  try {
    const r = await fetch('api/bot?name=' + encodeURIComponent(name));
    if (name !== selected) return;
    if (!r.ok) { $('bot-body').innerHTML = '<div class="muted">бота нет на сервере</div>'; return; }
    const b = await r.json();
    const inv = Object.entries(b.inventory).sort((x, y) => y[1] - x[1]);
    const doing = b.mining ? 'копает' : b.walking ? 'идёт' : b.queue.length ? 'крафтит' : 'стоит';
    const body = $('bot-body'), keep = body.scrollTop;
    const html = `
      <div class="muted">${doing} · (${b.x.toFixed(0)}, ${b.y.toFixed(0)}) · здоровье ${b.health} из ${b.max_health}</div>
      <div class="bar"><b style="width:${Math.min(100, 100 * b.health / b.max_health)}%"></b></div>
      <h3>Очередь крафта</h3><div class="items">${b.queue.length ? b.queue.map((q) => slot(q.recipe, q.count)).join('') : '<span class="muted">пусто</span>'}</div>
      <h3>Инвентарь</h3><div class="items">${inv.length ? inv.map(([k, v]) => slot(k, v)).join('') : '<span class="muted">пусто</span>'}</div>
      <h3>Чем занят</h3><div class="log">${b.log.length ? b.log.slice().reverse().map((l) => `<div class="${l.kind}"><time>${utcTime(l.time)}</time>${esc(l.text)}</div>`).join('') : '<span class="muted">записей нет</span>'}</div>`;
    if (html === lastBotHtml) return; // не перерисовываем без изменений: иконки не мигают, прокрутка не сбивается
    lastBotHtml = html;
    body.innerHTML = html;
    body.scrollTop = keep;
    if (tipFor && !document.contains(tipFor)) { const again = body.querySelector(`.slot[data-item="${CSS.escape(tipFor.dataset.item)}"]`); if (again && tip.classList.contains('pinned')) showTip(again, true); else hideTip(); }
  } catch { /* следующая попытка через 2 секунды */ }
}

// ---------- сессии Claude бота ----------
// Дерево: главная сессия и субагенты (кто кого запустил). Лог: текст виден сразу, шаги-инструменты свёрнуты.
const SS = { bot: null, id: null, agent: '', end: 0, start: 0, tools: new Map(), nodes: [], timer: null, gen: 0 };
const tm = (ts) => (ts ? new Date(ts).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '');
const dt = (ts) => new Date(ts).toLocaleString('ru', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const api = async (p) => { const r = await fetch(p); if (!r.ok) throw new Error(r.status); return r.json(); };
const sq = () => `bot=${encodeURIComponent(SS.bot)}&id=${SS.id}`;

async function openSessions(bot) {
  SS.bot = bot; SS.id = null;
  $('sess').classList.remove('hidden');
  $('sess-bot').textContent = bot;
  $('sess-tree').innerHTML = ''; $('sess-log').innerHTML = '<div class="muted">загрузка…</div>';
  try {
    SS.list = await api('api/sessions?bot=' + encodeURIComponent(bot));
    renderSessionList(true);
  } catch { $('sess-log').innerHTML = '<div class="muted">не удалось загрузить</div>'; }
}
// Архив — общий для всех зрителей: убранные сессии и субагенты не видны, пока не включена галочка «архив».
function renderSessionList(pick) {
  const all = SS.list || [], shown = all.filter((x) => SS.showArch || !x.archived), n = all.filter((x) => x.archived).length;
  $('sess-archn').textContent = n ? `(сессий: ${n})` : '';
  $('sess-list').innerHTML = shown.map((x) => `<option value="${x.id}">${x.archived ? '[архив] ' : ''}${x.active ? '● ' : ''}${esc(dt(x.mtime))}${x.current ? ' · текущая' : ''}${x.title ? ' · ' + esc(x.title) : ''}</option>`).join('');
  if (!shown.length) {
    SS.id = null; clearInterval(SS.timer); SS.gen++;
    $('sess-tree').innerHTML = '';
    $('sess-log').innerHTML = `<div class="muted">${all.length ? 'все сессии этого бота в архиве — включите галочку «архив»' : 'у этого бота нет сессий Claude (он управляется извне или ещё не запускался)'}</div>`;
    $('sess-arch').style.display = 'none';
    return;
  }
  $('sess-arch').style.display = '';
  if (pick || !shown.some((x) => x.id === SS.id)) pickSession((shown.find((x) => x.current) || shown[0]).id);
  else { $('sess-list').value = SS.id; syncArchBtn(); }
}
function syncArchBtn() { const cur = (SS.list || []).find((x) => x.id === SS.id); $('sess-arch').textContent = cur && cur.archived ? 'вернуть из архива' : 'в архив'; }
async function archive(agent, on) {
  const r = await fetch('api/session/archive', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ bot: SS.bot, id: SS.id, agent, archived: on }) });
  if (!r.ok) return;
  if (agent) { if (on && SS.agent === agent && !SS.showArch) pickNode(''); else loadTree().catch(() => {}); return; }
  const cur = SS.list.find((x) => x.id === SS.id);
  if (cur) cur.archived = on;
  renderSessionList(false);
}
$('sess-arch').onclick = () => { const cur = (SS.list || []).find((x) => x.id === SS.id); if (cur) archive('', !cur.archived); };
$('sess-show').onchange = (e) => { SS.showArch = e.target.checked; renderSessionList(false); if (SS.id) loadTree().catch(() => {}); };
function closeSessions() { clearInterval(SS.timer); SS.gen++; $('sess').classList.add('hidden'); }
function pickSession(id) {
  SS.id = id; $('sess-list').value = id; syncArchBtn();
  clearInterval(SS.timer);
  pickNode('');
  SS.timer = setInterval(pollSession, 2000);
}
async function loadTree() {
  const gen = SS.gen;
  const t = await api(`api/session/tree?${sq()}`);
  if (gen !== SS.gen) return;
  SS.nodes = t.nodes;
  const vis = t.nodes.filter((n) => SS.showArch || !n.archived), hidden = t.nodes.length - t.nodes.filter((n) => !n.archived).length;
  const kids = (parent, depth) => vis.filter((n) => n.parent === parent).map((n) =>
    `<div class="node${SS.agent === n.agent ? ' sel' : ''}${n.archived ? ' arch' : ''}" data-agent="${n.agent}" style="margin-left:${depth * 14}px"><span class="dot${n.running ? ' run' : ''}"></span>${esc(n.description || n.agent)}<button class="toarch" data-arch="${n.agent}" data-on="${n.archived ? 0 : 1}">${n.archived ? 'вернуть' : 'в архив'}</button><small>${n.archived ? 'в архиве · ' : ''}${n.running ? 'работает' : n.finished ? 'завершён' : 'остановлен'} · ${esc(tm(n.mtime))}${n.model ? ' · ' + esc(n.model) : ''}</small></div>${kids(n.agent, depth + 1)}`).join('');
  // Субагент, чей родитель скрыт в архиве, скрывается вместе с ним.
  $('sess-tree').innerHTML = `<div class="node${SS.agent === '' ? ' sel' : ''}" data-agent=""><span class="dot${t.nodes.some((n) => n.running) ? ' run' : ''}"></span>главная сессия<small>субагентов: ${t.nodes.length - hidden}, работает: ${t.nodes.filter((n) => n.running).length}${hidden ? `, в архиве: ${hidden}` : ''}</small></div>${kids('', 1)}`;
}
function evHtml(e) {
  const t = `<time>${tm(e.ts)}</time>`;
  if (e.k === 'text' && e.text.trim() === '.') return ''; // точка — условный ответ бота на служебное сообщение
  if (e.k === 'text') return `<div class="ev text">${t}${esc(e.text)}</div>`;
  if (e.k === 'human') return `<div class="ev human">${t}🎤 реплика человека (не показывается)</div>`;
  if (e.k === 'note') return `<div class="ev note">${t}${esc(e.text)}</div>`;
  if (e.k === 'task') return `<div class="ev task">${t}<b>задание:</b> ${esc(e.text)}</div>`;
  if (e.k === 'tool') {
    const brief = e.input.replace(/\s+/g, ' ').slice(0, 160);
    return `<details class="ev tool wait" id="tool-${e.id}"><summary>${t}<b>${esc(e.name)}</b> ${esc(brief)}</summary>${e.agent ? `<div class="sub"><button data-agent="${e.agent}">открыть субагента →</button></div>` : ''}<pre>${esc(e.input)}</pre><pre class="res muted">выполняется…</pre></details>`;
  }
  return '';
}
function applyResults(events) {
  for (const e of events) {
    if (e.k !== 'result') continue;
    const el = document.getElementById('tool-' + e.id);
    if (!el) continue;
    el.classList.remove('wait'); el.classList.toggle('err', e.error);
    const res = el.querySelector('.res'); res.classList.remove('muted'); res.textContent = e.text || '(пусто)';
  }
}
async function pickNode(agent) {
  SS.agent = agent; SS.end = 0; SS.start = 0;
  const gen = ++SS.gen, box = $('sess-log');
  box.innerHTML = '<div class="muted">загрузка…</div>';
  loadTree().catch(() => {});
  try {
    const r = await api(`api/session/log?${sq()}&agent=${agent}`);
    if (gen !== SS.gen) return;
    SS.end = r.end; SS.start = r.start;
    box.innerHTML = `${r.start > 0 ? '<button id="sess-older">показать более раннее</button>' : ''}<div id="sess-evs">${r.events.map(evHtml).join('')}</div>`;
    applyResults(r.events);
    box.scrollTop = box.scrollHeight;
  } catch { box.innerHTML = '<div class="muted">лог недоступен</div>'; }
}
async function pollSession() {
  if (!SS.id || !SS.end) return;
  const gen = SS.gen, box = $('sess-log');
  try {
    const r = await api(`api/session/log?${sq()}&agent=${SS.agent}&after=${SS.end}`);
    if (gen !== SS.gen) return;
    SS.end = r.end;
    if (r.events.length) {
      const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 60; // читают конец — держим конец
      document.getElementById('sess-evs').insertAdjacentHTML('beforeend', r.events.map(evHtml).join(''));
      applyResults(r.events);
      if (stick) box.scrollTop = box.scrollHeight;
    }
    loadTree().catch(() => {});
  } catch { /* следующая попытка через 2 секунды */ }
}
$('sess-log').onclick = async (e) => {
  const sub = e.target.closest('button[data-agent]');
  if (sub) return pickNode(sub.dataset.agent);
  if (e.target.id !== 'sess-older') return;
  const gen = SS.gen, box = $('sess-log'), h = box.scrollHeight;
  const r = await api(`api/session/log?${sq()}&agent=${SS.agent}&before=${SS.start}`);
  if (gen !== SS.gen) return;
  SS.start = r.start;
  document.getElementById('sess-evs').insertAdjacentHTML('afterbegin', r.events.map(evHtml).join(''));
  applyResults(r.events);
  if (r.start <= 0) e.target.remove();
  box.scrollTop += box.scrollHeight - h;
};
$('sess-tree').onclick = (e) => {
  const a = e.target.closest('.toarch');
  if (a) return archive(a.dataset.arch, a.dataset.on === '1');
  const n = e.target.closest('.node');
  if (n) pickNode(n.dataset.agent);
};
$('sess-list').onchange = (e) => pickSession(e.target.value);
$('sess-close').onclick = closeSessions;
$('bot-sess').onclick = () => openSessions(selected);

// ---------- подсказка по предмету ----------
// Наведение — название сразу; клик или касание — подсказка закрепляется, в ней ссылка на вики.
const tip = $('tip');
let tipFor = null;
function wikiUrl(name) {
  const en = NAMES_EN[name];
  return en ? `https://wiki.factorio.com/${encodeURIComponent(en.replace(/ /g, '_'))}/ru` : `https://wiki.factorio.com/index.php?search=${encodeURIComponent(name.replace(/-/g, ' '))}`;
}
function showTip(el, pinned) {
  const name = el.dataset.item;
  tipFor = el;
  tip.innerHTML = `<b>${esc(nm(name))}</b> × ${esc(el.dataset.n)}` + (pinned ? `<a href="${esc(wikiUrl(name))}" target="_blank" rel="noopener">открыть в вики ↗</a>` : '');
  tip.classList.toggle('pinned', pinned);
  tip.classList.remove('hidden');
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(6, Math.min(innerWidth - w - 6, r.left + r.width / 2 - w / 2)) + 'px';
  tip.style.top = (r.top - h - 6 > 6 ? r.top - h - 6 : r.bottom + 6) + 'px';
}
function hideTip() { tip.classList.add('hidden'); tip.classList.remove('pinned'); tipFor = null; }
document.addEventListener('mouseover', (e) => { const el = e.target.closest && e.target.closest('.slot[data-item]'); if (el && !tip.classList.contains('pinned')) showTip(el, false); });
document.addEventListener('mouseout', (e) => { if (!tip.classList.contains('pinned') && e.target.closest && e.target.closest('.slot[data-item]')) hideTip(); });
document.addEventListener('click', (e) => {
  if (e.target.closest('#tip')) return;
  const el = e.target.closest('.slot[data-item]');
  if (el) showTip(el, true); else if (!tip.classList.contains('hidden')) hideTip();
});
window.addEventListener('scroll', () => { if (!tip.classList.contains('hidden')) hideTip(); }, true);

// ---------- сводка ----------
let summary = null, events = [];
const kw = (v) => (v >= 1000 ? `${(v / 1000).toFixed(1)} МВт` : `${v} кВт`);
function renderSummary() {
  if (!summary) return;
  const r = summary.research;
  $('research').className = '';
  $('research').innerHTML = r.current
    ? `${esc(nm(r.current))} — ${Math.round(r.progress * 100)}%<div class="bar"><b style="width:${r.progress * 100}%"></b></div>` +
      (r.queue.length > 1 ? `<div class="muted">дальше: ${r.queue.slice(1).map((q) => esc(nm(q))).join(', ')}</div>` : '')
    : '<span class="muted">ничего не исследуется</span>';
  const p = summary.power;
  $('power').className = '';
  $('power').innerHTML = p.networks ? `выработка ${kw(p.production_kw)}, потребление ${kw(p.consumption_kw)}` + (p.networks > 1 ? ` <span class="muted">(сетей: ${p.networks})</span>` : '') : '<span class="muted">сети нет</span>';
  $('alerts').className = '';
  $('alerts').innerHTML = summary.alerts.length
    ? summary.alerts.map((a) => `<div class="alert" data-x="${a.x}" data-y="${a.y}"><b>${esc(STATUS[a.status] || a.status)}</b>: ${esc(nm(a.name))}${a.count > 1 ? ' × ' + a.count : ''}</div>`).join('')
    : '<span class="muted">всё работает</span>';
}
$('alerts').onclick = (e) => { const a = e.target.closest('.alert'); if (a) { setFollow(false); map.setView(ll(+a.dataset.x, +a.dataset.y), Math.max(map.getZoom(), ZMAX - 1)); } };
function renderEvents() {
  $('events').className = events.length ? '' : 'muted';
  $('events').innerHTML = events.length
    ? events.slice(-40).reverse().map((e) => `<div class="event">${e.at ? `<span class="muted">${new Date(e.at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' })}</span> ` : ''}<b>${esc(e.from)}</b>: ${esc(e.text)}</div>`).join('')
    : '—';
}
$('toggle').onclick = () => $('side').classList.toggle('hidden');
if (innerWidth > 900) $('side').classList.remove('hidden');

// ---------- связь с сервисом ----------
let ws = null;
function wsSend(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function sendView() {
  const b = map.getBounds();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'view', x1: b.getWest(), x2: b.getEast(), y1: b.getSouth(), y2: b.getNorth(), z: viewZ() }));
}
map.on('moveend', () => {
  const c = map.getCenter();
  history.replaceState(null, '', `#${c.lng.toFixed(0)},${c.lat.toFixed(0)},${map.getZoom()}`);
  sendView();
  updateFresh();
});
function connect() {
  ws = new WebSocket(new URL('ws', location.href.split('#')[0]).href.replace(/^http/, 'ws'));
  ws.onopen = sendView;
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.now) offset = m.now - Date.now();
    if (m.t === 'hello') {
      sweepMs = m.sweep_ms;
      if (m.cam) camSize = m.cam;
      tiles.clear();
      fogTiles.clear();
      for (const [z, x, y, ts, fog] of m.tiles) setTile(z, x, y, ts, fog);
      for (const k of shown.keys()) refreshTile(k);
      summary = m.summary; events = m.events || [];
      renderSummary(); renderEvents(); onLive(m.live);
    } else if (m.t === 'live') onLive(m);
    else if (m.t === 'tiles') {
      for (const [z, x, y, ts, fog] of m.up) refreshTile(setTile(z, x, y, ts, fog));
    } else if (m.t === 'summary') { summary = m.summary; renderSummary(); }
    else if (m.t === 'events') { events = events.concat(m.items).slice(-100); renderEvents(); }
  };
  ws.onclose = () => { $('st-conn').textContent = 'нет связи с картой, переподключение…'; $('st-conn').className = 'bad'; setTimeout(connect, 2000); };
}
connect();
