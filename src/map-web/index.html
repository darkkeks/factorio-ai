<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Карта Factorio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font: 14px/1.35 system-ui, sans-serif; color: #e8e6e1; background: #111; overflow: hidden; }
  #map { background: #000; }
  /* Схема тумана войны — по пикселю на клетку, как карта в игре: при увеличении не размываем, а оставляем чёткие клетки. */
  #map img.fog { image-rendering: pixelated; }
  #map .tile { overflow: hidden; }
  #map .tile img { position: absolute; }
  .leaflet-container { font: inherit; }

  .actor { transition: transform 1s linear; white-space: nowrap; pointer-events: auto; }
  .zooming .actor { transition: none; }
  .actor i { position: absolute; left: -7px; top: -7px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #111; background: #ffcc33; }
  .actor.player i { background: #6fd3ff; }
  .actor span { position: absolute; left: 0; top: -30px; transform: translateX(-50%); padding: 1px 6px; border-radius: 3px;
    background: rgba(17, 17, 17, .8); color: #ffcc33; font-weight: 600; font-size: 12px; }
  .actor.player span { color: #6fd3ff; }
  /* Что бот делает сейчас — как надпись над головой в игре. */
  .actor small { position: absolute; left: 0; top: -11px; transform: translateX(-50%); padding: 0 5px; border-radius: 3px; background: rgba(17, 17, 17, .75); color: #cfe6ff; font-size: 11px; }
  .actor small:empty { display: none; }
  .actor.bot { cursor: pointer; }
  .actor.sel i { outline: 2px solid #fff; }

  .box { background: rgba(24, 24, 24, .92); border: 1px solid #3a3a3a; border-radius: 6px; }
  #status { position: absolute; z-index: 1000; left: 50px; top: 10px; right: 54px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
  #status span { padding: 4px 9px; border-radius: 4px; background: rgba(24, 24, 24, .92); border: 1px solid #3a3a3a; }
  #status .warn { background: #6b4a00; border-color: #a87400; color: #fff; }
  #status .bad { background: #6d1f1f; border-color: #a33; color: #fff; }
  #status span:empty { display: none; }

  #toggle { position: absolute; z-index: 1001; right: 10px; top: 10px; width: 36px; height: 36px; font-size: 18px; color: inherit; cursor: pointer; }
  #side { position: absolute; z-index: 1000; right: 10px; top: 54px; bottom: 26px; width: 320px; max-width: calc(100vw - 20px); overflow-y: auto; padding: 10px 12px; box-sizing: border-box; }
  #side.hidden { display: none; }
  h3 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #9a968c; }
  h3:first-child { margin-top: 0; }
  .muted { color: #9a968c; }
  .bar { height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin: 4px 0; }
  .bar b { display: block; height: 100%; background: #5fae4e; }
  .alert { cursor: pointer; padding: 2px 0; }
  .alert:hover { color: #fff; }
  .alert b { color: #ff8a65; font-weight: 600; }
  .event { margin: 5px 0; overflow-wrap: anywhere; }
  .event b { color: #ffcc33; font-weight: 600; }

  #live { position: absolute; z-index: 1000; left: 10px; top: 84px; width: 480px; max-width: calc(100vw - 20px); padding: 6px; box-sizing: border-box; }
  /* Во всё окно браузера: карта остаётся под видео, сводка и панель бота — поверх. */
  #live.big { inset: 0; width: auto; max-width: none; z-index: 1002; border-radius: 0; border: 0; padding: 0; background: #000; display: flex; flex-direction: column; }
  #live.big video { flex: 1; min-height: 0; width: 100%; aspect-ratio: auto; object-fit: contain; border-radius: 0; }
  #live.big header { padding: 6px 54px 6px 8px; background: rgba(24, 24, 24, .92); }
  body.livebig #side, body.livebig #ent, body.livebig #layers, body.livebig #toggle { z-index: 1003; }
  #live select { background: #333; color: inherit; border: 1px solid #555; border-radius: 4px; padding: 4px 6px; font: inherit; max-width: 45%; }
  #live:fullscreen { inset: 0; width: auto; max-width: none; padding: 0; border: 0; background: #000; display: flex; flex-direction: column; }
  #live:fullscreen video { flex: 1; min-height: 0; aspect-ratio: auto; object-fit: contain; }
  #live.hidden { display: none; }
  #live video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 3px; }
  #live header { display: flex; align-items: center; gap: 8px; padding: 0 2px 5px; }
  #live header span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #live-btn { position: absolute; z-index: 1001; left: 10px; top: 84px; }
  /* Сессии Claude бота: слева дерево (сессия и её субагенты), справа лог выбранного узла. */
  #sess { position: absolute; z-index: 1100; inset: 10px; background: #181818; display: flex; flex-direction: column; overflow: hidden; }
  #sess.hidden { display: none; }
  #sess > header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #3a3a3a; }
  #sess > header b { color: #ffcc33; font-size: 16px; white-space: nowrap; }
  #sess > header select { flex: 1; min-width: 0; background: #333; color: inherit; border: 1px solid #555; border-radius: 4px; padding: 4px 6px; font: inherit; }
  #sess-main { flex: 1; min-height: 0; display: flex; }
  #sess-tree { width: 300px; flex: none; overflow-y: auto; border-right: 1px solid #3a3a3a; padding: 6px; box-sizing: border-box; }
  #sess-log { flex: 1; min-width: 0; overflow-y: auto; padding: 8px 14px; }
  .node { padding: 4px 6px; border-radius: 4px; cursor: pointer; overflow-wrap: anywhere; }
  .node:hover { background: #2c2c2c; }
  .node.sel { background: #3d3418; }
  .node small { display: block; color: #9a968c; }
  .node { position: relative; }
  .node.arch { opacity: .5; }
  .node .toarch { position: absolute; right: 4px; top: 4px; display: none; padding: 0 6px; font-size: 12px; }
  .node:hover .toarch { display: block; }
  #sess-show-l { white-space: nowrap; color: #9a968c; cursor: pointer; }
  @media (hover: none) { .node .toarch { display: block; } }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #666; margin-right: 6px; }
  .dot.run { background: #5fae4e; box-shadow: 0 0 5px #5fae4e; }
  .ev { margin: 6px 0; overflow-wrap: anywhere; }
  .ev time { color: #9a968c; font-size: 11px; margin-right: 6px; }
  .ev.text { white-space: pre-wrap; }
  .ev.note, .ev.task, .ev.human { color: #9a968c; white-space: pre-wrap; border-left: 2px solid #555; padding-left: 8px; }
  .ev.task { color: #c9c5b8; border-left-color: #c79400; }
  .ev.tool summary { cursor: pointer; font-family: ui-monospace, monospace; font-size: 12px; color: #b9c7d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.tool summary b { color: #e8e6e1; }
  .ev.tool.err summary b { color: #ff8a65; }
  .ev.tool.wait summary b { color: #5fae4e; }
  .ev.tool pre { margin: 4px 0 4px 14px; padding: 6px 8px; background: #111; border-radius: 4px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 400px; overflow-y: auto; }
  .ev.tool .sub { margin-left: 14px; }
  #sess-older { display: block; margin: 0 auto 8px; }
  @media (max-width: 700px) { #sess { inset: 0; } #sess-main { flex-direction: column; } #sess-tree { width: auto; max-height: 30%; border-right: 0; border-bottom: 1px solid #3a3a3a; } }
  button { background: #333; color: inherit; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button.on { background: #7a5c00; border-color: #c79400; }
  .items { display: flex; flex-wrap: wrap; gap: 4px; }
  .items .slot { position: relative; width: 40px; height: 40px; background: #2c2c2c; border: 1px solid #444; border-radius: 3px; overflow: hidden; }
  /* Файл иконки — 64×64 и следом уменьшенные копии; показываем только первую. */
  .items .slot img { position: absolute; left: 3px; top: 3px; width: 34px; height: 34px; object-fit: cover; object-position: left center; }
  .items .slot img + small { display: none; }
  .items .slot b { position: absolute; right: 2px; bottom: 0; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 1px 1px 1px #000; }
  .items .slot { cursor: pointer; }
  #tip { position: fixed; z-index: 2000; max-width: 260px; padding: 5px 9px; font-size: 13px; background: #101010; border: 1px solid #666; border-radius: 4px; box-shadow: 0 2px 8px #000; pointer-events: none; }
  #tip.pinned { pointer-events: auto; }
  #tip.hidden { display: none; }
  #tip a { display: block; margin-top: 4px; color: #6fd3ff; }
  .items .slot small { position: absolute; inset: 2px; font-size: 8px; line-height: 1.1; overflow: hidden; overflow-wrap: anywhere; color: #ccc; }
  .log div { margin: 4px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .log .tool { font-family: ui-monospace, monospace; font-size: 12px; color: #b9c7d6; }
  .log time { color: #9a968c; margin-right: 6px; }
  /* Кнопки слоёв карты — те же, что в игре (спрайты из файлов игры). */
  #layers { position: absolute; z-index: 1000; right: 10px; bottom: 26px; display: grid; grid-template-columns: repeat(6, 36px); gap: 2px; padding: 4px; background: #313031; border: 1px solid #1c1c1c; border-radius: 4px; box-shadow: 0 0 0 1px #4a4a4a inset; }
  #layers button { width: 36px; height: 36px; padding: 0; border: 1px solid #1f1f1f; border-radius: 3px; background: #8e8e8e linear-gradient(#a6a6a6, #7b7b7b); box-shadow: inset 0 1px 0 #cfcfcf; }
  #layers button:hover { filter: brightness(1.12); }
  #layers button.on { background: #f1be64 linear-gradient(#f9d795, #e8a93b); box-shadow: inset 0 1px 0 #ffeec2; }
  #layers button i { display: block; width: 32px; height: 32px; margin: 1px; background: url(ui/map-buttons.png) 0 0 / 48px 352px no-repeat; }
  .nonames .actor span, .nonames .actor small { display: none; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
  /* Окно сведений о выбранной постройке — как подсказка в игре. */
  #ent { position: absolute; z-index: 1000; right: 10px; top: 54px; width: 300px; max-width: calc(100vw - 20px); max-height: calc(100% - 190px); overflow-y: auto; box-sizing: border-box; background: #313031; border: 1px solid #1c1c1c; border-radius: 4px; box-shadow: 0 2px 10px #000; color: #fff; }
  #ent.hidden { display: none; }
  #ent header { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; padding: 5px 8px; background: #f1dcb4; color: #111; font-weight: 700; font-size: 15px; }
  #ent header b { flex: 1; }
  #ent header button { background: none; border: 0; color: #111; padding: 0 4px; font-size: 15px; }
  #ent header .botonly { display: none; font-size: 13px; font-weight: 600; border: 1px solid #8a7a5a; border-radius: 3px; margin-right: 4px; padding: 1px 6px; }
  #ent.bot header .botonly { display: block; }
  #ent header .botonly.on { background: #c79400; color: #fff; }
  #ent.bot { width: 360px; }
  #ent .log { font-size: 13px; }
  /* Вблизи имя бота видно на самой картинке игры — своё не дублируем. */
  .closeup .actor.bot span { display: none; }
  #ent section { padding: 6px 8px; border-top: 1px solid #1c1c1c; box-shadow: 0 1px 0 #454445 inset; }
  #ent section > div { margin: 2px 0; }
  #ent h4 { margin: 0 0 4px; font-size: 14px; color: #ffe6c0; }
  #ent .k { font-weight: 700; color: #ffe6c0; }
  #ent .desc { color: #e8e6e1; }
  #ent .st i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: #5fe04a; box-shadow: 0 0 4px currentColor; }
  #ent .st.y i { background: #f0d232; } #ent .st.r i { background: #e8412c; }
  #ent .bar { height: 8px; background: #1c1c1c; border-radius: 0; }
  #ent .bar b { background: #5fae4e; }
  #ent .bar.fl b { background: #2f7fd6; } #ent .bar.fuel b { background: #e8a93b; }
  #ent .items { align-items: center; }
  #ent .arrow { color: #9a968c; padding: 0 2px; }
  @media (min-width: 701px) { body:has(#side:not(.hidden)) #layers, body:has(#side:not(.hidden)) #ent { right: 340px; } }
  @media (max-width: 700px) { #ent { left: 10px; right: 10px; width: auto; top: auto; bottom: 112px; max-height: 40%; z-index: 1001; } }
  #hover { position: fixed; z-index: 2000; padding: 3px 8px; background: rgba(16, 16, 16, .9); border: 1px solid #555; border-radius: 3px; font-size: 13px; pointer-events: none; white-space: nowrap; }
  #hover.hidden { display: none; }
  .leaflet-control-attribution { display: none; }
  @media (max-width: 700px) { #side { width: auto; left: 10px; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="status"><span id="st-conn" class="bad">подключение…</span><span id="st-cam" class="warn"></span><span id="st-pause" class="warn"></span><span id="st-fresh"></span></div>
<button id="toggle" class="box" title="Сводка">☰</button>
<div id="side" class="box hidden">
  <h3>Исследование</h3><div id="research" class="muted">—</div>
  <h3>Электросеть</h3><div id="power" class="muted">—</div>
  <h3>Тревоги</h3><div id="alerts" class="muted">—</div>
  <h3>События</h3><div id="events" class="muted">—</div>
</div>
<button id="live-btn" class="box">▶ живое окно</button>
<div id="live" class="box hidden">
  <header><span id="live-cap" class="muted">подключение…</span><select id="live-target" title="За кем следит камера"></select><button id="live-size" title="Во всё окно">⤢</button><button id="live-full" title="На весь экран">⛶</button><button id="live-close">✕</button></header>
  <video id="live-video" muted autoplay playsinline></video>
</div>
<div id="sess" class="box hidden">
  <header><b id="sess-bot"></b><select id="sess-list" title="Сессия"></select><button id="sess-arch" title="Убрать эту сессию в архив (или вернуть)">в архив</button><label id="sess-show-l" title="Показывать убранное в архив"><input type="checkbox" id="sess-show"> архив <span id="sess-archn"></span></label><button id="sess-close">✕</button></header>
  <div id="sess-main"><div id="sess-tree"></div><div id="sess-log"></div></div>
</div>
<div id="tip" class="hidden"></div>
<div id="layers"></div>
<div id="ent" class="hidden"><header><b id="ent-name"></b><button id="bot-sess" class="botonly">сессии</button><button id="bot-follow" class="botonly">следить</button><button id="ent-close" title="Закрыть">✕</button></header><div id="ent-body"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let NAMES = {}, NAMES_EN = {};
let DESC = {}, STATUS_RU = {};
fetch('names.json').then((r) => r.json()).then((n) => { NAMES = n.ru || {}; NAMES_EN = n.en || {}; DESC = n.desc || {}; STATUS_RU = n.status || {}; renderSummary(); }).catch(() => {});
const nm = (k) => NAMES[k] || k;
const STATUS = { no_fuel: 'нет топлива', no_power: 'нет питания', low_power: 'мало питания', not_plugged_in_electric_network: 'не подключено к сети',
  no_minable_resources: 'руда кончилась', missing_science_packs: 'нет колб', no_ammo: 'нет патронов', no_input_fluid: 'нет жидкости', missing_required_fluid: 'нет жидкости' };

const ZREF = 5, ZMAX = 6, TILE = 512; // на уровне ZREF — 32 пикселя на клетку (масштаб игры 1), тайл 16×16 клеток; ZMAX — 64 пикселя на клетку
const CRS = L.extend({}, L.CRS.Simple, { transformation: new L.Transformation(32 / 2 ** ZREF, 0, 32 / 2 ** ZREF, 0) });
const ll = (x, y) => L.latLng(y, x);
const span = (z) => 16 * 2 ** (ZREF - z);

// Адрес хранит позицию и масштаб: #x,y,z
const start = (location.hash.slice(1).split(',').map(Number));
const hasStart = start.length === 3 && start.every(Number.isFinite);
const map = L.map('map', { crs: CRS, minZoom: 0, maxZoom: ZMAX + 0.5, zoomSnap: 0, zoomDelta: 0.5, scrollWheelZoom: false, zoomControl: true, attributionControl: false, zoomAnimation: true })
  .setView(hasStart ? ll(start[0], start[1]) : ll(0, 0), hasStart ? start[2] : ZREF - 2);

// Колесо и тачпад — свой обработчик: у Leaflet зум колесом идёт ступеньками с задержкой, а щипок тачпада на Mac
// (мелкие события колеса с ctrlKey) почти не двигал масштаб. Здесь масштаб меняется пропорционально прокрутке,
// вокруг курсора, раз в кадр. Safari присылает щипок не колесом, а событиями gesture* — их обрабатываем отдельно.
{
  let acc = 0, at = null, raf = 0, moving = false, endTimer = 0;
  // Двигаем вид так же, как Leaflet при щипке на телефоне (_move): setZoom без анимации сбрасывает слой тайлов
  // целиком (viewreset) — экран чернел до загрузки. Так прежние тайлы остаются, пока не загрузятся новые.
  const apply = () => {
    raf = 0;
    if (!acc) return;
    const zoom = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), map.getZoom() + acc));
    acc = 0;
    const half = map.getSize().divideBy(2), off = at.subtract(half).multiplyBy(1 - 1 / map.getZoomScale(zoom));
    const center = map.containerPointToLatLng(half.add(off));
    if (!moving) { map._stop(); map._moveStart(true, false); moving = true; }
    map._move(center, zoom);
    clearTimeout(endTimer);
    endTimer = setTimeout(() => { moving = false; map._moveEnd(true); }, 200);
  };
  const zoomBy = (d, x, y) => {
    acc += d;
    at = map.mouseEventToContainerPoint({ clientX: x, clientY: y });
    if (!raf) raf = requestAnimationFrame(apply);
  };
  map.getContainer().addEventListener('wheel', (e) => {
    e.preventDefault();
    // Пиксели: щипок (ctrlKey) — крупный шаг на пиксель, прокрутка тачпадом и колесо мыши — мельче (у колеса ~100 на щелчок).
    const px = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * 800 : e.deltaY;
    zoomBy(-px * (e.ctrlKey ? 0.012 : 0.004), e.clientX, e.clientY);
  }, { passive: false });
  let gStart = 0;
  map.getContainer().addEventListener('gesturestart', (e) => { e.preventDefault(); gStart = map.getZoom(); });
  map.getContainer().addEventListener('gesturechange', (e) => { e.preventDefault(); acc = 0; zoomBy(gStart + Math.log2(e.scale) - map.getZoom(), e.clientX, e.clientY); });
  map.getContainer().addEventListener('gestureend', (e) => e.preventDefault());
}

// ---------- тайлы с версиями ----------
const tiles = new Map(); // "z/x/y" -> когда снят по часам сервера (0 — ещё не снят)
const shown = new Map(); // "z/x/y" -> <img> на экране
const fogTiles = new Set(); // тайлы целиком в тумане войны: они не устаревают, пока чанк снова не увидят
const vers = new Map();  // "z/x/y" -> версия картинки: меняется, только когда новый снимок отличается от прежнего
const tileUrl = (k) => `tiles/${k}.jpg?v=${vers.get(k)}`;
const EMPTY = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
// На экранах высокой плотности (телефоны) берём тайлы на уровень подробнее и показываем вдвое меньше:
// иначе тайл растягивается в 2–3 раза и всё размывается. RET — на сколько уровней подробнее.
const RET = (window.devicePixelRatio || 1) >= 1.5 ? 1 : 0;
const tileKey = (c) => `${c.z + RET}/${c.x}/${c.y}`;
// Тайл на экране — рамка с картинкой внутри. Пока своего тайла нет (ещё не снят), в рамке показывается увеличенный
// кусок ближайшего более грубого уровня — без чёрных дыр. Готовым тайл объявляется только после загрузки картинки:
// до этого Leaflet держит на экране тайлы прежнего масштаба, и при зуме ничего не пропадает.
function source(k) {
  if (tiles.get(k)) return { k, d: 0, ox: 0, oy: 0 };
  const [z, x, y] = k.split('/').map(Number);
  for (let d = 1; d <= z; d++) {
    const f = 2 ** d, px = Math.floor(x / f), py = Math.floor(y / f), pk = `${z - d}/${px}/${py}`;
    if (tiles.get(pk)) return { k: pk, d, ox: x - px * f, oy: y - py * f };
  }
  return null;
}
function paint(el, k, done) {
  const src = source(k), img = el.firstChild;

    img.classList.toggle('fog', fogTiles.has(src.k));

let offset = 0, sweepMs = 600000, paused = false;

function updateFresh() {
  const b = map.getBounds(), z = viewZ(), s = span(z);
  const x1 = Math.floor(Math.min(b.getWest(), b.getEast()) / s), x2 = Math.floor(Math.max(b.getWest(), b.getEast()) / s);
  const y1 = Math.floor(Math.min(b.getSouth(), b.getNorth()) / s), y2 = Math.floor(Math.max(b.getSouth(), b.getNorth()) / s);
  let oldest = 0, n = 0, missing = 0, foggy = 0;

  const limit = sweepMs * 1.5;
  for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) {
    const ts = tiles.get(`${z}/${x}/${y}`);
    if (ts === undefined) continue;
    n++;
    if (fogTiles.has(`${z}/${x}/${y}`)) { foggy++; continue; }
    if (!ts) { missing++; continue; }
    const a = now() - ts;
    if (a > oldest) oldest = a;

    if (a > limit && !paused) L.rectangle([ll(x * s, y * s), ll(x * s + s, y * s + s)], { stroke: false, fillColor: '#ff9800', fillOpacity: 0.3, interactive: false }).addTo(staleLayer);

}

const LAYER_DEFS = [['logistics', 0, 'Логистические сети'], ['electric', 1, 'Электрические сети'], ['turrets', 2, 'Зоны покрытия турелей'], ['pollution', 3, 'Загрязнение'], ['stations', 4, 'Названия станций'], ['players', 5, 'Имена игроков'],
  ['tags', 6, 'Теги'], ['robots', 7, 'Рабочие дроны'], ['signals', 8, 'Ж/д сигналы'], ['recipes', 9, 'Значки рецептов'], ['pipes', 10, 'Показывать трубопроводы']];
let layersOn = new Set(['stations', 'players', 'tags']), layerData = {}, layerTimer = null;
try { const v = JSON.parse(localStorage.getItem('layers')); if (Array.isArray(v)) layersOn = new Set(v); } catch { /* настройки по умолчанию */ }
map.createPane('overlay').style.zIndex = 450; // над тайлами, под метками ботов и игроков
map.getPane('overlay').style.pointerEvents = 'none';
const canvas = document.createElement('canvas');
canvas.id = 'overlay';
map.getPane('overlay').appendChild(canvas);
const icons = new Map(); // имя -> Image (первая, крупная копия иконки)
function icon(name) {
  let im = icons.get(name);
  if (!im) { im = new Image(); im.onload = drawLayers; im.src = `icon/${encodeURIComponent(name)}.png`; icons.set(name, im); }
  return im.complete && im.naturalWidth ? im : null;
}
function label(ctx, text, x, y, color) {
  ctx.font = '600 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + 10;
  ctx.fillStyle = 'rgba(17, 17, 17, .8)'; ctx.fillRect(x - w / 2, y - 9, w, 18);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
let zoomAnim = false;
function drawLayers() {
  const size = map.getSize(), dpr = window.devicePixelRatio || 1;
  if (canvas.width !== size.x * dpr || canvas.height !== size.y * dpr) { canvas.width = size.x * dpr; canvas.height = size.y * dpr; canvas.style.width = size.x + 'px'; canvas.style.height = size.y + 'px'; }
  L.DomUtil.setPosition(canvas, map.containerPointToLayerPoint([0, 0]));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size.x, size.y);
  if (zoomAnim) return;
  const o = map.latLngToContainerPoint(ll(0, 0)), k = 32 * 2 ** (map.getZoom() - ZREF); // пикселей на клетку
  const X = (x) => o.x + x * k, Y = (y) => o.y + y * k;
  const seen = (x, y, r) => X(x + r) >= 0 && X(x - r) <= size.x && Y(y + r) >= 0 && Y(y - r) <= size.y;
  const on = (n) => layersOn.has(n) && layerData[n];
  let d;
  if ((d = on('pollution'))) {
    const c = list(d.chunks);
    for (let i = 0; i < c.length; i += 3) if (seen(c[i] * 32 + 16, c[i + 1] * 32 + 16, 16)) {
      ctx.fillStyle = `rgba(255, 0, 0, ${Math.min(0.55, 0.02 + c[i + 2] / 320).toFixed(3)})`;
      // Края округляем одинаково у соседних чанков: иначе они перекрываются на пиксель и видна сетка.
      const px = Math.round(X(c[i] * 32)), py = Math.round(Y(c[i + 1] * 32));
      ctx.fillRect(px, py, Math.round(X(c[i] * 32 + 32)) - px, Math.round(Y(c[i + 1] * 32 + 32)) - py);
    }
  }
  if ((d = on('logistics'))) {
    const p = list(d.ports);
    for (const [j, color] of [[3, 'rgba(70, 200, 70, .16)'], [2, 'rgba(255, 150, 30, .28)']]) {
      ctx.beginPath();
      for (let i = 0; i < p.length; i += 4) if (seen(p[i], p[i + 1], p[i + j])) ctx.rect(X(p[i] - p[i + j]), Y(p[i + 1] - p[i + j]), 2 * p[i + j] * k, 2 * p[i + j] * k);
      ctx.fillStyle = color; ctx.fill();
    }
  }
  if ((d = on('electric'))) {
    const p = list(d.poles), w = list(d.wires);
    ctx.beginPath();
    for (let i = 0; i < p.length; i += 3) if (seen(p[i], p[i + 1], p[i + 2])) ctx.rect(X(p[i] - p[i + 2]), Y(p[i + 1] - p[i + 2]), 2 * p[i + 2] * k, 2 * p[i + 2] * k);
    ctx.fillStyle = 'rgba(60, 150, 255, .26)'; ctx.fill();
    ctx.beginPath();
    for (let i = 0; i < w.length; i += 4) { ctx.moveTo(X(w[i]), Y(w[i + 1])); ctx.lineTo(X(w[i + 2]), Y(w[i + 3])); }
    ctx.strokeStyle = 'rgba(150, 215, 255, .95)'; ctx.lineWidth = Math.max(1, Math.min(3, k * 0.1)); ctx.stroke();
    if (k >= 3) { ctx.fillStyle = '#eaf6ff'; for (let i = 0; i < p.length; i += 3) if (seen(p[i], p[i + 1], 1)) { const r = Math.max(1.5, k * 0.16); ctx.fillRect(X(p[i]) - r, Y(p[i + 1]) - r, 2 * r, 2 * r); } }
  }
  if ((d = on('turrets'))) {
    const t = list(d.turrets);
    ctx.beginPath();
    for (let i = 0; i < t.length; i += 3) if (seen(t[i], t[i + 1], t[i + 2])) { ctx.moveTo(X(t[i]) + t[i + 2] * k, Y(t[i + 1])); ctx.arc(X(t[i]), Y(t[i + 1]), t[i + 2] * k, 0, 2 * Math.PI); }
    ctx.fillStyle = 'rgba(230, 60, 40, .2)'; ctx.fill('nonzero');
  }
  if ((d = on('pipes'))) {
    const col = (n) => { const c = d.colors && d.colors[n]; return c ? `rgb(${c.map((v) => Math.round(60 + v * 195)).join(',')})` : '#9a9a9a'; };
    for (const [x1, y1, x2, y2, n] of list(d.pipes)) if (seen((x1 + x2) / 2, (y1 + y2) / 2, 3)) { ctx.fillStyle = col(n); ctx.fillRect(X(x1), Y(y1), Math.max(1.5, (x2 - x1) * k), Math.max(1.5, (y2 - y1) * k)); }
    ctx.lineWidth = Math.max(1, k * 0.25); ctx.setLineDash([Math.max(2, k * 0.4), Math.max(2, k * 0.3)]);
    for (const [x1, y1, x2, y2, n] of list(d.links)) { ctx.strokeStyle = col(n); ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke(); }
    ctx.setLineDash([]);
  }
  if ((d = on('recipes')) && k >= 5) {
    for (const [x, y, s, n] of list(d.machines)) if (seen(x, y, 3)) {
      const px = Math.max(14, Math.min(64, s * k * 0.75)), im = icon(n);
      ctx.fillStyle = 'rgba(0, 0, 0, .55)'; ctx.beginPath(); ctx.arc(X(x), Y(y), px * 0.6, 0, 2 * Math.PI); ctx.fill();
      if (im) ctx.drawImage(im, 0, 0, im.naturalHeight, im.naturalHeight, X(x) - px / 2, Y(y) - px / 2, px, px);
    }
  }
  if ((d = on('signals'))) {
    const s = list(d.signals), st = d.states || {};
    for (let i = 0; i < s.length; i += 3) if (seen(s[i], s[i + 1], 1)) {
      ctx.fillStyle = s[i + 2] === st.open ? '#3fe04a' : s[i + 2] === st.closed ? '#f03a2a' : s[i + 2] === st.reserved ? '#f0d232' : '#4aa3ff';
      ctx.beginPath(); ctx.arc(X(s[i]), Y(s[i + 1]), Math.max(2.5, k * 0.35), 0, 2 * Math.PI); ctx.fill();
    }
  }
  if ((d = on('robots'))) {
    const r = list(d.robots), px = Math.max(1.5, Math.min(5, k * 0.2));
    for (let i = 0; i < r.length; i += 3) if (seen(r[i], r[i + 1], 1)) { ctx.fillStyle = r[i + 2] ? '#ffb347' : '#e8f4ff'; ctx.fillRect(X(r[i]) - px, Y(r[i + 1]) - px, 2 * px, 2 * px); }
  }
  if ((d = on('tags'))) {
    for (const [x, y, text, type, n] of list(d.tags)) if (seen(x, y, 40 / k + 1) && !actors.some((a) => a.name === text)) { // тег бота дублировал бы его метку
      const im = n && type !== 'virtual' ? icon(n) : null;
      if (im) ctx.drawImage(im, 0, 0, im.naturalHeight, im.naturalHeight, X(x) - 12, Y(y) - 12, 24, 24);
      else { ctx.fillStyle = '#ffd23a'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X(x), Y(y), 6, 0, 2 * Math.PI); ctx.fill(); ctx.stroke(); }
      if (text) label(ctx, text, X(x), Y(y) + 22, '#ffe6c0');
    }
  }
  if ((d = on('stations'))) for (const [x, y, name] of list(d.stops)) if (seen(x, y, 40 / k + 1)) label(ctx, '🚉 ' + name, X(x), Y(y) - 14, '#fff');
}
map.on('move zoom viewreset resize', drawLayers);
map.on('zoomanim', () => { zoomAnim = true; drawLayers(); });
const closeup = () => map.getContainer().classList.toggle('closeup', map.getZoom() >= 5);
map.on('zoomend', () => { zoomAnim = false; closeup(); drawLayers(); });
closeup();
async function loadLayers() {
  const want = [...layersOn].filter((l) => l !== 'players');
  if (!want.length || document.hidden) return;
  try { Object.assign(layerData, await api('api/layers?l=' + want.join(','))); drawLayers(); } catch { /* следующая попытка по таймеру */ }
}
function syncLayers() {
  $('layers').innerHTML = LAYER_DEFS.map(([id, row, title]) => `<button data-l="${id}" title="${title}" class="${layersOn.has(id) ? 'on' : ''}"><i style="background-position:0 ${-row * 32}px"></i></button>`).join('');
  map.getContainer().classList.toggle('nonames', !layersOn.has('players'));
  for (const k of Object.keys(layerData)) if (!layersOn.has(k)) delete layerData[k];
  drawLayers();
}
$('layers').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const id = b.dataset.l;
  if (layersOn.has(id)) layersOn.delete(id); else layersOn.add(id);
  try { localStorage.setItem('layers', JSON.stringify([...layersOn])); } catch { /* без сохранения */ }
  syncLayers(); loadLayers();
};
syncLayers(); loadLayers();
setInterval(loadLayers, 2500);

// ---------- сводка ----------
let summary = null, events = [];
const kw = (v) => (v >= 1000 ? `${(v / 1000).toFixed(1)} МВт` : `${v} кВт`);
function renderSummary() {
  if (!summary) return;
  const r = summary.research;
  $('research').className = '';
  $('research').innerHTML = r.current
    ? `${esc(nm(r.current))} — ${Math.round(r.progress * 100)}%<div class="bar"><b style="width:${r.progress * 100}%"></b></div>` +
      (r.queue.length > 1 ? `<div class="muted">дальше: ${r.queue.slice(1).map((q) => esc(nm(q))).join(', ')}</div>` : '')
    : '<span class="muted">ничего не исследуется</span>';
  const p = summary.power;
  $('power').className = '';
  $('power').innerHTML = p.networks ? `выработка ${kw(p.production_kw)}, потребление ${kw(p.consumption_kw)}` + (p.networks > 1 ? ` <span class="muted">(сетей: ${p.networks})</span>` : '') : '<span class="muted">сети нет</span>';
  $('alerts').className = '';
  $('alerts').innerHTML = summary.alerts.length
    ? summary.alerts.map((a) => `<div class="alert" data-x="${a.x}" data-y="${a.y}"><b>${esc(STATUS[a.status] || a.status)}</b>: ${esc(nm(a.name))}${a.count > 1 ? ' × ' + a.count : ''}</div>`).join('')
    : '<span class="muted">всё работает</span>';
}
$('alerts').onclick = (e) => { const a = e.target.closest('.alert'); if (a) { setFollow(false); map.setView(ll(+a.dataset.x, +a.dataset.y), Math.max(map.getZoom(), ZREF - 1)); } };
function renderEvents() {
  $('events').className = events.length ? '' : 'muted';
  $('events').innerHTML = events.length
    ? events.slice(-40).reverse().map((e) => `<div class="event">${e.at ? `<span class="muted">${new Date(e.at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' })}</span> ` : ''}<b>${esc(e.from)}</b>: ${esc(e.text)}</div>`).join('')
    : '—';
}
$('toggle').onclick = () => $('side').classList.toggle('hidden');
if (innerWidth > 900) $('side').classList.remove('hidden');

// ---------- связь с сервисом ----------
let ws = null;
function wsSend(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function sendView() {
  if (document.hidden) return wsSend({ t: 'view', none: true }); // скрытая вкладка не занимает камеру и не качает тайлы
  const b = map.getBounds();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'view', x1: b.getWest(), x2: b.getEast(), y1: b.getSouth(), y2: b.getNorth(), z: viewZ() }));
}
// Тайлы двух более грубых уровней вокруг вида держим в кеше браузера: при отдалении они нужны сразу,
// а весят мало (на уровень грубее — вчетверо меньше тайлов на ту же площадь).
const warm = new Map(); // url -> Image
function prefetchCoarse() {
  const b = map.getBounds(), z = viewZ(), x1 = b.getWest(), x2 = b.getEast(), y1 = Math.min(b.getSouth(), b.getNorth()), y2 = Math.max(b.getSouth(), b.getNorth()), w = x2 - x1, h = y2 - y1;
  const keep = new Set();
  for (let d = 1; d <= 2 && z - d >= 0; d++) {
    const s = span(z - d);
    for (let x = Math.floor((x1 - w) / s); x <= Math.floor((x2 + w) / s); x++)
      for (let y = Math.floor((y1 - h) / s); y <= Math.floor((y2 + h) / s); y++) {
        const k = `${z - d}/${x}/${y}`;
        if (!tiles.get(k)) continue;
        const url = tileUrl(k);
        keep.add(url);
        if (!warm.has(url)) { const im = new Image(); im.src = url; warm.set(url, im); }
      }
  }
  for (const u of warm.keys()) if (!keep.has(u)) warm.delete(u);
}
map.on('moveend', () => {
  prefetchCoarse();
  const c = map.getCenter();
  history.replaceState(null, '', `#${c.lng.toFixed(0)},${c.lat.toFixed(0)},${+map.getZoom().toFixed(2)}`);
  sendView();
  updateFresh();
});
document.addEventListener('visibilitychange', sendView);
function connect() {
  ws = new WebSocket(new URL('ws', location.href.split('#')[0]).href.replace(/^http/, 'ws'));
  ws.onopen = () => { sendView(); sendSelect(); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.now) offset = m.now - Date.now();
    if (m.t === 'reset') return location.reload(); // на сервере другая карта: всё накопленное на странице — от прежней
    if (m.t === 'hello') {
      sweepMs = m.sweep_ms;
      if (m.cam) camSize = m.cam;
      tiles.clear();
      fogTiles.clear();
      vers.clear();
      for (const [z, x, y, ts, fog, ver] of m.tiles) setTile(z, x, y, ts, fog, ver);
      for (const k of shown.keys()) refreshTile(k);
      prefetchCoarse();
      summary = m.summary; events = m.events || [];
      renderSummary(); renderEvents(); onLive(m.live);
    } else if (m.t === 'live') onLive(m);
    else if (m.t === 'tiles') {
      for (const [z, x, y, ts, fog, ver] of m.up) { const old = vers.get(`${z}/${x}/${y}`), k = setTile(z, x, y, ts, fog, ver); if (vers.get(k) !== old) refreshTile(k); }
    } else if (m.t === 'entity') { if (ENT.sel && m.x === ENT.sel.x && m.y === ENT.sel.y && !selected) renderEnt(m.data); }
    else if (m.t === 'bot') renderBot(m.name, m.data);
    else if (m.t === 'summary') { summary = m.summary; renderSummary(); }
    else if (m.t === 'events') { events = events.concat(m.items).slice(-100); renderEvents(); }
  };
  ws.onclose = () => { $('st-conn').textContent = 'нет связи с картой, переподключение…'; $('st-conn').className = 'bad'; setTimeout(connect, 2000); };
}
connect();
</script>
