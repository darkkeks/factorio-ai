<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Отрисовка Factorio</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #e8e6e1; font: 14px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #info { position: absolute; left: 10px; top: 10px; padding: 5px 10px; background: rgba(24, 24, 24, .9); border: 1px solid #3a3a3a; border-radius: 4px; pointer-events: none; }
  #info b { color: #ffcc33; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"><b>отрисовка в браузере · прототип</b> — игра рисуется в браузере из очереди отрисовки клиента. <span id="st">подключение…</span></div>
<script>
'use strict';
// Прототип: кадр — список «спрайт № n в точке (x, y) с масштабом и цветом», присланный сервисом по WebSocket.
// Картинки спрайтов — вырезки из атласов игры (/render/sprite/<поколение>/<n>.png), грузятся по мере появления.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const spr = [];            // n -> { w, h, sx, sy, sc, img, ok }
let gen = '', frame = null, frameN = 0, dirty = true;
let view = { x: 0, y: 0, k: 24, auto: true };
let cam = null;       // что видит клиент-камера: {x, y, w, h} в клетках
let gameOn = false; // подключён ли клиент игры с перехватом
let showBg = true; // клавиша B — показать/скрыть подложку // центр в клетках, пикселей на клетку

// Картинка вырезки из атласа: сам спрайт или его часть (нарезанные спрайты, кадры). Грузим по мере появления.
const shadowCv = document.createElement('canvas'), shadowCtx = shadowCv.getContext('2d'); // буфер теней
const crops = new Map(); // "n-x-y-w-h" -> { img, ok, failed }
function crop(s, x, y, w, h) {
  const full = !x && !y && w === s.w && h === s.h, k = full ? `${s.n}` : `${s.n}-${x}-${y}-${w}-${h}`;
  let c = crops.get(k);
  if (!c) {
    c = { img: new Image(), ok: false };
    c.img.onload = () => { c.ok = true; dirty = true; };
    c.img.onerror = () => { crops.delete(k); }; // атлас ещё не пришёл — попросим снова
    c.img.src = `sprite/${gen}/${k}.png`;
    crops.set(k, c);
  }
  return c.ok ? c.img : null;
}
function connect() {
  const ws = new WebSocket(new URL('ws', location.href).href.replace(/^http/, 'ws'));
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => {
    if (typeof e.data !== 'string') { frame = new Int32Array(e.data); frameN++; dirty = true; return; }
    const m = JSON.parse(e.data);
    if (m.t === 'reset') { gen = m.gen; spr.length = 0; frame = null; crops.clear(); }
    else if (m.t === 'sprites') { for (const s of m.list) spr[s.n] = s; if ('game' in m) { gameOn = m.game; dirty = true; } }
    else if (m.t === 'game') { gameOn = m.on; dirty = true; }
    else if (m.t === 'cam') { cam = m.w ? m : null; dirty = true; }
    else if (m.t === 'atlas') dirty = true; // недостающие вырезки перезапросятся при следующей отрисовке
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();

// Подложка: снимки основной карты (/tiles/z/x/y.jpg). Землю игра рисует из кеша текстур чанков, мимо очереди
// отрисовки, поэтому пока берём её со снимков; постройки на снимке совпадают с нарисованными поверх.
const bg = new Map(); // "z/x/y" -> { img, ok, at }
function background(W, H) {
  const z = Math.max(0, Math.min(6, Math.round(5 + Math.log2(view.k / 32)))), span = 16 * 2 ** (5 - z);
  const x1 = Math.floor((view.x - W / 2 / view.k) / span), x2 = Math.floor((view.x + W / 2 / view.k) / span);
  const y1 = Math.floor((view.y - H / 2 / view.k) / span), y2 = Math.floor((view.y + H / 2 / view.k) / span);
  const bucket = Math.floor(Date.now() / 30000); // перечитываем снимки раз в полминуты
  for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) {
    const k = `${z}/${x}/${y}`;
    let t = bg.get(k);
    if (!t || t.at !== bucket) {
      const img = new Image(), nt = { img, ok: false, at: bucket, prev: t && t.ok ? t : null };
      img.onload = () => { nt.ok = true; nt.prev = null; dirty = true; };
      img.src = `../tiles/${k}.jpg?b=${bucket}`;
      bg.set(k, t = nt);
    }
    const show = t.ok ? t : t.prev;
    if (show) ctx.drawImage(show.img, (x * span - view.x) * view.k + W / 2, (y * span - view.y) * view.k + H / 2, span * view.k + 0.5, span * view.k + 0.5);
  }
}

function draw() {
  requestAnimationFrame(draw);
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; dirty = true; }
  if (!dirty) return;
  dirty = false;
  // Без клиента игры показываем хотя бы подложку — и говорим, почему нет построек.
  // Запись (9 целых): спрайт, x, y (1/256 клетки, центр), поворот<<16 | слой, масштаб x, y (×1000, атлас → 32 на клетку),
  // цвет RGBA, вырезка x | y<<16, w | h<<16. Порядок записей — уже игровой (слой, ключ сортировки), рисуем подряд.
  const R = 9, f = gameOn && frame ? frame : new Int32Array(0), n = f.length / R;
  if (view.auto && cam) { view.x = cam.x; view.y = cam.y; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (showBg) background(W, H);
  ctx.imageSmoothingEnabled = true;
  let shown = 0, missing = 0, g = ctx, shadowsDone = false;
  // Тени игра собирает в отдельный буфер (перекрытия не темнеют сильнее) и накладывает его между слоями 119 и 120.
  if (shadowCv.width !== cv.width || shadowCv.height !== cv.height) { shadowCv.width = cv.width; shadowCv.height = cv.height; }
  const flushShadows = () => {
    if (g === ctx) return;
    g = ctx; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 0.5; ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(shadowCv, 0, 0); ctx.restore();
  };
  for (let i = 0; i < n; i++) {
    const o = i * R, s = spr[f[o]];
    const layer = f[o + 3] & 0xffff, rot = (f[o + 3] >>> 16) / 65536 * 2 * Math.PI;
    if (layer === 1000 && g === ctx && !shadowsDone) { shadowsDone = true; g = shadowCtx; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H); }
    else if (layer !== 1000) flushShadows();
    // Слой 255 — освещение (карта света, днём не видна), спрайты-«только свет» — тоже.
    if (!s || s.fl & 8 || layer === 255) continue;
    const cxr = f[o + 7] & 0xffff, cyr = f[o + 7] >>> 16, cw = f[o + 8] & 0xffff, ch = f[o + 8] >>> 16;
    const img = crop(s, cxr, cyr, cw, ch);
    if (!img) { missing++; continue; }
    const w = cw * f[o + 4] / 1000 / 32, h = ch * f[o + 5] / 1000 / 32;      // размер в клетках
    const cx = (f[o + 1] / 256 - view.x) * view.k + W / 2, cy = (f[o + 2] / 256 - view.y) * view.k + H / 2;
    const r = Math.max(w, h) * view.k;
    if (cx - r > W || cy - r > H || cx + r < 0 || cy + r < 0) continue;
    const tint = f[o + 6] >>> 0;
    g.globalAlpha = layer === 1000 ? 1 : (tint >>> 24) / 255;
    g.globalCompositeOperation = layer === 1001 || (s.fl & 4) ? 'lighter' : 'source-over';
    if (rot) { g.save(); g.translate(cx, cy); g.rotate(rot); g.drawImage(img, -w / 2 * view.k, -h / 2 * view.k, w * view.k, h * view.k); g.restore(); }
    else g.drawImage(img, cx - w / 2 * view.k, cy - h / 2 * view.k, w * view.k, h * view.k);
    shown++;
  }
  flushShadows();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  // Вне вида камеры — только снимки карты (без анимаций): затемняем и обводим границу.
  if (cam && gameOn) {
    const x1 = (cam.x - cam.w / 2 - view.x) * view.k + W / 2, y1 = (cam.y - cam.h / 2 - view.y) * view.k + H / 2, w = cam.w * view.k, h = cam.h * view.k;
    ctx.fillStyle = 'rgba(0, 0, 0, .45)';
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.rect(x1, y1, w, h); ctx.fill('evenodd');
    ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 1.5; ctx.setLineDash([8, 6]); ctx.strokeRect(x1, y1, w, h); ctx.setLineDash([]);
  }
  document.getElementById('st').textContent = !gameOn ? 'клиент игры с перехватом сейчас не запущен — видна только подложка со снимков карты' : `кадр ${frameN}: записей ${n}, нарисовано ${shown}, картинок ещё нет ${missing}, спрайтов известно ${spr.length}`;
}
draw();

// Перетаскивание и зум колесом/щипком.
let drag = null;
cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; view.auto = false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => { if (!drag) return; view.x -= (e.clientX - drag.x) / view.k; view.y -= (e.clientY - drag.y) / view.k; drag = { x: e.clientX, y: e.clientY }; dirty = true; });
cv.addEventListener('pointerup', () => { drag = null; });
cv.addEventListener('wheel', (e) => { e.preventDefault(); view.k = Math.max(2, Math.min(128, view.k * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)))); dirty = true; }, { passive: false });
addEventListener('keydown', (e) => { if (e.key === 'b' || e.key === 'и') { showBg = !showBg; dirty = true; } });
cv.addEventListener('dblclick', () => { view.auto = true; dirty = true; });
</script>
</body>
</html>
