<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Отрисовка Factorio</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #e8e6e1; font: 14px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #ov { position: absolute; left: 0; top: 0; pointer-events: none; }
  #info { position: absolute; left: 10px; top: 10px; padding: 5px 10px; background: rgba(24, 24, 24, .9); border: 1px solid #3a3a3a; border-radius: 4px; pointer-events: none; }
  #info b { color: #ffcc33; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ov"></canvas>
<div id="info"><b>отрисовка в браузере · прототип</b> — игра рисуется в браузере из очереди отрисовки клиента. <span id="st">подключение…</span></div>
<script>
'use strict';
// Прототип: кадр — список «спрайт № n в точке (x, y) с масштабом и цветом», присланный сервисом по WebSocket.
// Картинки спрайтов — куски атласов игры (/render/atlas/<поколение>/<атлас>/<x>-<y>.png), грузятся по мере надобности.
// Отрисовка — WebGL2: все спрайты кадра — несколько вызовов отрисовки «экземплярами», смешивание — формулой игры
// (предумноженная прозрачность): результат = картинка·цвет_записи + фон·(1 − α·α_записи). На Canvas 2D это было
// 8–9 тыс. drawImage и тысячи смен режима смешивания на кадр — 100+ мс даже на видеокарте.
const cv = document.getElementById('c'), ov = document.getElementById('ov'), octx = ov.getContext('2d');
const gl = cv.getContext('webgl2', { alpha: false, premultipliedAlpha: true, antialias: false });
if (!gl) document.getElementById('st').textContent = 'браузер не дал WebGL2 — отрисовка невозможна (включите аппаратное ускорение)';
const spr = [];            // n -> { w, h, sx, sy, sc, a, ax, ay, fl }
let gen = '', frame = null, frameN = 0, dirty = true;
let view = { x: 0, y: 0, k: 24, auto: true };
let cam = null;       // что видит клиент-камера: {x, y, w, h} в клетках
let dark = 0;        // темнота поверхности (0 — день), по ней — карта освещения
let gameOn = false; // подключён ли клиент игры с перехватом
let showBg = true; // клавиша B — показать/скрыть подложку

function shader(type, src) {
  const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u };
}

// Куски атласов 256×256 — слои текстурных массивов (до 4 массивов по 256 слоёв); спрайт на стыке кусков — несколько четырёхугольников.
const TILE = 256, ARR_LAYERS = 256, MAX_ARRS = 4;
const arrs = [];           // { tex, used, mip }
const tiles = new Map();   // "a/x-y" -> { img, slot: массив·256 + слой, −1 — ещё нет }
const lastSrc = new Map(); // место (слой, x, y) -> последний целиком загруженный прямоугольник атласа [a, x, y, w, h]
function allocLayer() {
  let a = arrs.find((x) => x.used < ARR_LAYERS);
  if (!a) {
    if (arrs.length >= MAX_ARRS) { resetAtlas(); return -1; } // места нет — начинаем заново (куски перегрузятся)
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, tex);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 9, gl.RGBA8, TILE, TILE, ARR_LAYERS);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    arrs.push(a = { tex, used: 0, mip: false });
  }
  return arrs.indexOf(a) * ARR_LAYERS + a.used++;
}
function resetAtlas() {
  for (const a of arrs) gl.deleteTexture(a.tex);
  arrs.length = 0; tiles.clear(); lastSrc.clear();
}
function tile(a, tx, ty) {
  const k = `${a}/${tx}-${ty}`;
  let t = tiles.get(k);
  if (!t) {
    const g0 = gen;
    t = { img: new Image(), slot: -1 };
    t.img.onload = () => {
      if (g0 !== gen || tiles.get(k) !== t) return;
      const slot = allocLayer();
      if (slot < 0) return;
      const ar = arrs[slot >> 8];
      gl.bindTexture(gl.TEXTURE_2D_ARRAY, ar.tex);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      // Кусок у края атласа может быть меньше 256 — кладём как есть, остальное в слое не используется.
      gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, slot & 255, t.img.width, t.img.height, 1, gl.RGBA, gl.UNSIGNED_BYTE, t.img);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      ar.mip = true; t.slot = slot; t.img = null; dirty = true;
    };
    t.img.onerror = () => { setTimeout(() => { if (tiles.get(k) === t) tiles.delete(k); }, 2000); }; // атлас ещё распаковывается — попросим снова
    t.img.src = `atlas/${gen}/${a}/${tx}-${ty}.png`;
    tiles.set(k, t);
  }
  return t.slot;
}
function ready(a, sx, sy, sw, sh) {
  if (a === undefined || !sw || !sh) return false;
  let ok = true;
  for (let ty = Math.floor(sy / TILE); ty <= Math.floor((sy + sh - 1) / TILE); ty++)
    for (let tx = Math.floor(sx / TILE); tx <= Math.floor((sx + sw - 1) / TILE); tx++) if (tile(a, tx, ty) < 0) ok = false;
  return ok;
}

// Экземпляр (17 чисел): центр (клетки от центра вида), прямоугольник в своих осях (x0, y0, w, h, клетки),
// поворот, вырезка в куске (u0, v0, u1, v1, пиксели), слой текстуры, цвет RGBA (0..1), режим (0 — обычный, 1 — сложением).
const IF = 17;
let inst = new Float32Array(IF * 20000), ni = 0;
function emit(cx, cy, w, h, rot, fx, fy, a, sx, sy, sw, sh, tr, tg, tb, ta, mode) {
  const kx = w / sw, ky = h / sh;
  for (let ty = Math.floor(sy / TILE); ty <= Math.floor((sy + sh - 1) / TILE); ty++)
    for (let tx = Math.floor(sx / TILE); tx <= Math.floor((sx + sw - 1) / TILE); tx++) {
      const slot = tile(a, tx, ty);
      if (slot < 0) continue;
      const x0 = Math.max(sx, tx * TILE), x1 = Math.min(sx + sw, tx * TILE + TILE), y0 = Math.max(sy, ty * TILE), y1 = Math.min(sy + sh, ty * TILE + TILE);
      // Кусок в своих осях спрайта (до поворота); отражение — зеркально относительно центра.
      let lx = -w / 2 + (x0 - sx) * kx, ly = -h / 2 + (y0 - sy) * ky;
      const lw = (x1 - x0) * kx, lh = (y1 - y0) * ky;
      let u0 = x0 - tx * TILE, u1 = x1 - tx * TILE, v0 = y0 - ty * TILE, v1 = y1 - ty * TILE;
      if (fx < 0) { lx = -lx - lw; const t = u0; u0 = u1; u1 = t; }
      if (fy < 0) { ly = -ly - lh; const t = v0; v0 = v1; v1 = t; }
      if ((ni + 1) * IF > inst.length) { const b = new Float32Array(inst.length * 2); b.set(inst); inst = b; }
      const o = ni++ * IF;
      inst[o] = cx; inst[o + 1] = cy; inst[o + 2] = lx; inst[o + 3] = ly; inst[o + 4] = lw; inst[o + 5] = lh; inst[o + 6] = rot;
      inst[o + 7] = u0; inst[o + 8] = v0; inst[o + 9] = u1; inst[o + 10] = v1; inst[o + 11] = slot;
      inst[o + 12] = tr; inst[o + 13] = tg; inst[o + 14] = tb; inst[o + 15] = ta; inst[o + 16] = mode;
    }
}

const SPRITE_VS = `#version 300 es
in vec2 a_c; in vec4 a_rect; in float a_rot; in vec4 a_uv; in float a_slot; in vec4 a_tint; in float a_mode;
uniform vec2 u_scale; // клетка -> clip
out vec3 v_uv; out vec4 v_tint; flat out int v_arr; flat out float v_mode;
void main() {
  vec2 q = vec2(gl_VertexID & 1, gl_VertexID >> 1);
  vec2 l = a_rect.xy + q * a_rect.zw;
  float c = cos(a_rot), s = sin(a_rot);
  vec2 p = a_c + vec2(l.x * c - l.y * s, l.x * s + l.y * c);
  gl_Position = vec4(p * u_scale, 0.0, 1.0);
  v_uv = vec3(mix(a_uv.xy, a_uv.zw, q) / 256.0, mod(a_slot, 256.0));
  v_arr = int(a_slot) / 256; v_tint = a_tint; v_mode = a_mode;
}`;
const SPRITE_FS = `#version 300 es
precision highp float; precision highp sampler2DArray;
uniform sampler2DArray u_t0, u_t1, u_t2, u_t3;
in vec3 v_uv; in vec4 v_tint; flat in int v_arr; flat in float v_mode;
out vec4 o;
void main() {
  vec4 t = v_arr == 0 ? texture(u_t0, v_uv) : v_arr == 1 ? texture(u_t1, v_uv) : v_arr == 2 ? texture(u_t2, v_uv) : texture(u_t3, v_uv);
  o = t * v_tint;                         // предумноженная картинка × цвет записи
  if (v_mode > 0.5) o.a = 0.0;            // 1 — свечение и свет: сложением
}`;
const sprite = program(SPRITE_VS, SPRITE_FS);
const ibuf = gl.createBuffer(), vao = gl.createVertexArray();
const ATTRS = [['a_c', 2, 0], ['a_rect', 4, 2], ['a_rot', 1, 6], ['a_uv', 4, 7], ['a_slot', 1, 11], ['a_tint', 4, 12], ['a_mode', 1, 16]];
const attrLoc = ATTRS.map(([nm]) => gl.getAttribLocation(sprite.p, nm));
// Пустые массивы-заглушки: у сэмплера в шейдере обязательно должна быть текстура нужного вида.
const emptyArr = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D_ARRAY, emptyArr); gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA8, 1, 1, 1);
function drawRange(first, count, scale) {
  if (count <= 0) return;
  gl.useProgram(sprite.p);
  for (let i = 0; i < MAX_ARRS; i++) { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D_ARRAY, arrs[i] ? arrs[i].tex : emptyArr); gl.uniform1i(sprite.u['u_t' + i], i); }
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform2f(sprite.u.u_scale, scale[0], scale[1]);
  gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER, ibuf);
  ATTRS.forEach(([, size, off], i) => {
    const loc = attrLoc[i];
    if (loc < 0) return;
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, IF * 4, (first * IF + off) * 4);
    gl.vertexAttribDivisor(loc, 1);
  });
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
  gl.bindVertexArray(null);
}

// Простые четырёхугольники: подложка (снимки), наложение буфера теней, ночь.
const QUAD_VS = `#version 300 es
uniform vec4 u_rect; uniform vec4 u_src; // clip x0, y0, x1, y1; текстура u0, v0, u1, v1
out vec2 v_uv;
void main() { vec2 q = vec2(gl_VertexID & 1, gl_VertexID >> 1); gl_Position = vec4(mix(u_rect.xy, u_rect.zw, q), 0.0, 1.0); v_uv = mix(u_src.xy, u_src.zw, q); }`;
const quad = program(QUAD_VS, `#version 300 es
precision highp float; uniform sampler2D u_tex; uniform float u_k; in vec2 v_uv; out vec4 o;
void main() { o = texture(u_tex, v_uv) * u_k; }`);
const nightP = program(QUAD_VS, `#version 300 es
precision highp float; uniform sampler2D u_scene, u_light; uniform mat3 u_m; in vec2 v_uv; out vec4 o;
void main() {
  vec3 c = texture(u_scene, v_uv).rgb, L = min(texture(u_light, v_uv).rgb, 1.0);
  o = vec4(mix(u_m * c, c, L), 1.0);   // ночь — матрица из таблицы цветов игры; где светит — дневной цвет
}`);
const emptyVao = gl.createVertexArray();
function drawQuad(pr, rect, src) {
  gl.useProgram(pr.p);
  gl.uniform4f(pr.u.u_rect, rect[0], rect[1], rect[2], rect[3]); gl.uniform4f(pr.u.u_src, src[0], src[1], src[2], src[3]);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindVertexArray(null);
}
// Буферы кадра размером с экран: тени, сцена (для ночи), карта света.
const target = () => ({ tex: gl.createTexture(), fb: gl.createFramebuffer(), w: 0, h: 0 });
function sizeTarget(t, w, h) {
  if (t.w === w && t.h === h) return;
  t.w = w; t.h = h;
  gl.bindTexture(gl.TEXTURE_2D, t.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
const shadowT = target(), sceneT = target(), lightT = target();

// Вид страницы сообщаем основному сервису карты (тот же /ws, что у основной страницы): камера в первую очередь
// снимает тайлы подложки под ним. Уровень — тот, что рисует подложка.
let mapWs = null;
function sendBgView() {
  if (!mapWs || mapWs.readyState !== 1) return;
  if (document.hidden || !showBg) return mapWs.send(JSON.stringify({ t: 'view', none: true }));
  const W = cv.clientWidth, H = cv.clientHeight, z = Math.max(0, Math.min(6, Math.round(5 + Math.log2(view.k / 32))));
  mapWs.send(JSON.stringify({ t: 'view', x1: view.x - W / 2 / view.k, x2: view.x + W / 2 / view.k, y1: view.y - H / 2 / view.k, y2: view.y + H / 2 / view.k, z }));
}
function connectMap() {
  mapWs = new WebSocket(new URL('../ws', location.href).href.replace(/^http/, 'ws'));
  mapWs.onopen = sendBgView;
  mapWs.onclose = () => setTimeout(connectMap, 3000);
}
connectMap();
setInterval(sendBgView, 2000);

// Кадр приходит разностью с прошлым (src/render-delta.mjs): операции «новая запись» (0), «копия записи прошлого кадра j» (−1 − j),
// «ещё v записей прошлого подряд» (v > 0); новые записи — по столбцам, x и y — разностью с предыдущей новой.
function decodeFrame(d, prev) {
  const R = 10;
  let k = 0;
  if (d[k] === 0x31445246) k++;                       // старый формат — без времени
  else if (d[k] === 0x32445246) { k++; decodeFrame.time = d[k++]; }
  else if (d[k] === 0x33445246) {                      // со временем и прямоугольником окна (1/16 клетки)
    k++; decodeFrame.time = d[k++];
    decodeFrame.rect = d[k] || d[k + 2] ? [d[k] / 16, d[k + 1] / 16, d[k + 2] / 16, d[k + 3] / 16] : null; k += 4;
  }
  else return d;
  const n = d[k++], K = d[k++], opsAt = k; k += K;
  const m = d[k++], cols = k, f = new Int32Array(n * R);
  let o = 0, last = -2, ni = 0, px = 0, py = 0;
  const take = (j) => { f.set(prev.subarray(j * R, j * R + R), o); o += R; last = j; };
  for (let q = 0; q < K; q++) {
    const v = d[opsAt + q];
    if (v === 0) {
      for (let c = 0; c < R; c++) f[o + c] = d[cols + c * m + ni];
      if (ni) { f[o + 1] += px; f[o + 2] += py; }
      px = f[o + 1]; py = f[o + 2]; ni++; o += R; last = -2;
    } else if (v < 0) take(-1 - v);
    else for (let t = 0; t < v; t++) take(last + 1);
  }
  return f;
}

// Показ по времени съёмки, а не по приходу: кадр с отметкой камеры t показывается в момент t + сдвиг часов + запас.
// Сдвиг — наименьшая (за 5 с) разница «пришёл − снят», запас PLAY_DELAY_MS сглаживает неровные задержки сети и сервиса.
const PLAY_DELAY_MS = 80;
let decoded = null;               // последний разобранный кадр (от него считается разность следующего)
const playQ = [];                 // [{ f, t }] — разобранные, ещё не показанные
const offs = [];                  // [{ at, off }] за последние 5 с
function receive(d) {
  decodeFrame.time = undefined; decodeFrame.rect = null;
  decoded = decodeFrame(d, decoded);
  const now = performance.now();
  arrivals.push(now);
  if (decodeFrame.time === undefined) { frame = decoded; frameN++; dirty = true; return; } // без отметок — сразу
  const t = decodeFrame.time;
  offs.push({ at: now, off: now - t });
  while (offs.length && now - offs[0].at > 5000) offs.shift();
  playQ.push({ f: decoded, t, rect: decodeFrame.rect });
  if (playQ.length > 30) playQ.splice(0, playQ.length - 30);
}
function playout() {
  if (!playQ.length) return;
  const now = performance.now();
  let base = Infinity; for (const o of offs) base = Math.min(base, o.off);
  const due = now - base - PLAY_DELAY_MS;   // по часам камеры: какой кадр показывать сейчас
  let pick = -1;
  for (let i = 0; i < playQ.length; i++) if (playQ[i].t <= due) pick = i;
  // Отстали больше чем на полсекунды (вкладка спала и т. п.) — сразу к последнему.
  if (playQ.length && due - playQ[playQ.length - 1].t > 500) pick = playQ.length - 1;
  if (pick < 0) return;
  frame = playQ[pick].f; liveRect = playQ[pick].rect || null; frameN++; dirty = true; shows.push(now);
  playQ.splice(0, pick + 1);
}
const shows = [];
let liveRect = null; // где живые записи: прямоугольник окна игры, от которого пришёл кадр (клетки)

// Вид сообщаем сервису: он держит в игре окно с запасом вокруг него (свой поток кадров у каждого зрителя).
let renderWs = null, viewSent = '';
function sendView() {
  if (!renderWs || renderWs.readyState !== 1) return;
  const W = cv.clientWidth, H = cv.clientHeight;
  const m = view.auto ? { t: 'view', auto: true } : { t: 'view', x: +view.x.toFixed(2), y: +view.y.toFixed(2), w: +(W / view.k).toFixed(2), h: +(H / view.k).toFixed(2) };
  const s = JSON.stringify(m);
  if (s !== viewSent) { viewSent = s; renderWs.send(s); }
}
setInterval(sendView, 50);
function connect() {
  const ws = renderWs = new WebSocket(new URL('ws?d=1', location.href).href.replace(/^http/, 'ws'));
  ws.onopen = () => { viewSent = ''; sendView(); };
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => {
    if (typeof e.data !== 'string') { receive(new Int32Array(e.data)); return; }
    const m = JSON.parse(e.data);
    if (m.t === 'reset') { gen = m.gen; spr.length = 0; frame = null; decoded = null; playQ.length = 0; resetAtlas(); }
    // Картинки спрайтов грузим сразу, а не при первом появлении в кадре.
    else if (m.t === 'sprites') { for (const s of m.list) spr[s.n] = s; if ('game' in m) { gameOn = m.game; dirty = true; } }
    else if (m.t === 'game') { gameOn = m.on; dirty = true; }
    else if (m.t === 'dark') { dark = m.dark; dirty = true; }
    else if (m.t === 'cam') { cam = m.w ? m : null; dirty = true; }
    else if (m.t === 'atlas') dirty = true; // пришёл атлас — недостающие куски перезапросятся при отрисовке
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();

// Подложка: снимки основной карты (/tiles/z/x/y.jpg). Землю игра рисует из кеша текстур чанков, мимо очереди
// отрисовки, поэтому пока берём её со снимков; постройки на снимке совпадают с нарисованными поверх.
const bg = new Map(); // "z/x/y" -> { tex, ok, bad, at, prev }
function bgTile(z, x, y, bucket) {
  const k = `${z}/${x}/${y}`;

// Таблица цветов ночи (lut-night из данных игры) почти линейна: белый ≈ сумма чистых красного, зелёного, синего.
// Поэтому ночь — матрица цвета из углов таблицы, смешанная с единичной по темноте.
let nightLut = null;
{
  const img = new Image();
  img.onload = () => { const c = document.createElement('canvas'); c.width = 256; c.height = 16; const g = c.getContext('2d'); g.drawImage(img, 0, 0); nightLut = g.getImageData(0, 0, 256, 16).data; dirty = true; };
  img.src = 'lut-night.png';

function nightMatrix(w) {

  for (let j = 0; j < 3; j++) for (let k = 0; k < 3; k++) m[j * 3 + k] = (k === j ? 1 : 0) + (at(...col[j], k) - (k === j ? 1 : 0)) * w;
  return m;
}

// Для строки состояния: когда приходили кадры (за 3 с) и сколько занимает отрисовка — чтобы видеть, рвёт ли сеть/камера или браузер.
const arrivals = [];
function netStat() {
  const now = performance.now();
  while (arrivals.length && now - arrivals[0] > 3000) arrivals.shift();
  let gap = arrivals.length ? now - arrivals[arrivals.length - 1] : 0;
  for (let i = 1; i < arrivals.length; i++) gap = Math.max(gap, arrivals[i] - arrivals[i - 1]);
  while (shows.length && now - shows[0] > 3000) shows.shift();
  let sgap = 0; for (let i = 1; i < shows.length; i++) sgap = Math.max(sgap, shows[i] - shows[i - 1]);
  return `от камеры ${(arrivals.length / 3).toFixed(1)} кадр/с, самая длинная пауза ${gap.toFixed(0)} мс; показано ${(shows.length / 3).toFixed(1)} кадр/с, пауза до ${sgap.toFixed(0)} мс`;

let drawMs = 0;
function draw() {
  requestAnimationFrame(draw);
  const t0 = performance.now();
  try { drawFrame(); } finally { if (performance.now() - t0 > 1) drawMs = drawMs * 0.8 + (performance.now() - t0) * 0.2; }
}
function drawFrame() {

  if (cv.width !== Wd || cv.height !== Hd) { cv.width = Wd; cv.height = Hd; ov.width = Wd; ov.height = Hd; dirty = true; }
  playout();
  if (!dirty) return;
  dirty = false;
  // Запись (10 целых): спрайт, x, y (1/256 клетки, центр), поворот<<16 | слой, масштаб x, y (×1000, атлас → 32 на клетку),
  // цвет RGBA, вырезка x | y<<16, w | h<<16, флаги. Порядок записей — уже игровой (слой, ключ сортировки), рисуем подряд.
  const R = 10, f = gameOn && frame ? frame : new Int32Array(0), n = f.length / R;
  if (view.auto && cam) { view.x = cam.x; view.y = cam.y; }
  // Камера ни за кем не следит (на сервере нет ботов и игроков) — центр по записям кадра.
  else if (view.auto && n) { let sx = 0, sy = 0; for (let i = 0; i < n; i++) { sx += f[i * R + 1]; sy += f[i * R + 2]; } view.x = sx / n / 256; view.y = sy / n / 256; }

  const scale = [2 * k / W, -2 * k / H];
  const toClip = (x0, y0, x1, y1) => [(x0 - view.x) * scale[0], (y0 - view.y) * scale[1], (x1 - view.x) * scale[0], (y1 - view.y) * scale[1]];
  // Записи -> экземпляры: сцена до теней [0, sh0), тени [sh0, sh1), сцена после [sh1, sc1), свет [sc1, ni).
  ni = 0;
  let sh0 = -1, sh1 = -1, shown = 0, missing = 0;
  const lights = [];
  const vw = W / 2 / k, vh = H / 2 / k;
  for (let i = 0; i < n; i++) {
    const o = i * R, s = spr[f[o]];
    if (!s) continue;

    // Слой 92 — декали (трава, камешки на земле): они уже есть на снимке-подложке, второй раз — вдвое гуще и ярче, чем в игре.
    if (layer === 92 && showBg) continue;

    drawRange(0, sh0, scale);
    // Тени игра собирает в отдельный буфер (перекрытия не темнеют сильнее) и накладывает его между слоями 119 и 120 с силой 0,5.

}
draw();

// Перетаскивание и зум колесом/щипком.
let drag = null;
cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; view.auto = false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => { if (!drag) return; view.x -= (e.clientX - drag.x) / view.k; view.y -= (e.clientY - drag.y) / view.k; drag = { x: e.clientX, y: e.clientY }; dirty = true; });

cv.addEventListener('wheel', (e) => { e.preventDefault(); view.k = Math.max(2, Math.min(128, view.k * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)))); dirty = true; }, { passive: false });
addEventListener('keydown', (e) => { if (e.key === 'b' || e.key === 'и') { showBg = !showBg; dirty = true; } });
cv.addEventListener('dblclick', () => { view.auto = true; dirty = true; });
