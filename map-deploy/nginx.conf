map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
  listen 80;
  server_name _;

  # Интерфейс ботов (v2/server на хосте): POST /v2/<операция>, GET /v2/help. Снаружи — по HTTPS через Cloudflare.
  # Ожидание действия сервер ботов для внешних запросов сам ограничивает 50 секундами (признак — X-Forwarded-For).
  location /v2/ {
    proxy_pass http://172.25.0.1:8765;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 4m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Файлы для скачивания по неугадываемым ссылкам: ~/exports/public/<случайное имя>/<файл> на хосте.
  location /export/ {
    alias /srv/export/;
    autoindex off;
  }

  # Карта: страница, тайлы и два WebSocket (/ws — данные, /video — живое окно)
  location / {
    proxy_pass http://172.25.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_set_header Host $host;
  }
}
