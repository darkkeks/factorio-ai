# X-сервер клиента-камеры на встроенной графике (i915, без монитора).
Section "ServerFlags"
  Option "AutoAddDevices" "false"
  Option "DontVTSwitch" "true"
  Option "BlankTime" "0"
  Option "StandbyTime" "0"
  Option "SuspendTime" "0"
  Option "OffTime" "0"
EndSection
Section "Device"
  Identifier "igpu"
  Driver "modesetting"
  Option "kmsdev" "/dev/dri/card1"
  Option "AccelMethod" "glamor"
EndSection
Section "Screen"
  Identifier "screen"
  Device "igpu"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Virtual 1280 720
  EndSubSection
EndSection
